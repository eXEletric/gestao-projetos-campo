<!doctype html><html lang="pt-br"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Entrada de campo · eX</title>
<style>
:root{--pri:#533ab7;--pri2:#3a2b86;--ink:#1b1a17;--ink2:#5f5d57;--ink3:#8c8981;--line:#e4dfd4;--bg:#faf8f4;--surf:#fff;--ok:#2c6e12;--okbg:#eaf5df;--amber:#8a5410;--amberbg:#faeeda}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.hd{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:12px 14px}
.hd .bk{font-size:12px;color:#cfc7ee;text-decoration:none}
.hd .t{font-weight:700;font-size:16px;margin-top:3px}
.hd .m{font-size:11.5px;color:#d7d0f2;margin-top:2px}
.prog{margin-top:9px;background:rgba(255,255,255,.22);border-radius:20px;height:6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#c7f299;transition:width .3s}
.pl{display:flex;justify-content:space-between;font-size:11px;color:#e7e2f7;margin-top:4px}
.tools{padding:10px 14px 2px}
.srch{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--surf)}
.it{background:var(--surf);border-top:1px solid #efeadf}
.itr{display:flex;align-items:center;gap:10px;padding:11px 14px}
.it.on{background:var(--okbg)}
.info{flex:1;min-width:0;cursor:pointer}
.nm{font-size:14px;font-weight:500}
.cd{font-size:11px;color:var(--ink3);font-family:ui-monospace,monospace}
.chk{color:var(--ok);font-size:11px;font-weight:600}
.stp{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surf);flex:none}
.stp button{width:40px;height:40px;border:none;background:var(--surf);font-size:22px;color:var(--pri)}
.stp button:active{background:#f1eefb}
.stp .q{width:42px;text-align:center;font-weight:700;font-size:16px;border-left:1px solid #efeadf;border-right:1px solid #efeadf;height:40px;line-height:40px}
.det{padding:0 14px 12px 14px;background:var(--okbg);display:none}
.det.show{display:block}
.det .r{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.det input{flex:1;min-width:100px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:#fff}
.fotob{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 12px;font-size:13px;color:var(--pri);font-weight:600}
.fotob.ok{background:#e7f2da;color:var(--ok);border-color:#cfe4b6}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.aib{display:inline-flex;align-items:center;gap:6px;border:1px solid #cfe4b6;border-radius:9px;background:#f4fbee;padding:8px 12px;font-size:12.5px;color:var(--ok);font-weight:600}
.grp{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);padding:14px 15px 5px;font-weight:600}
.foot{position:sticky;bottom:0;background:var(--surf);border-top:1px solid var(--line);padding:11px 14px;display:flex;align-items:center;gap:10px}
.foot .n{font-size:12.5px;color:var(--ink2)}.foot .n b{color:var(--ink)}
.btn{margin-left:auto;background:var(--pri);color:#fff;border:none;border-radius:11px;padding:13px 20px;font-size:15px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.btn:disabled{opacity:.5}
.state{padding:56px 24px;text-align:center;color:var(--ink2)}
.newb{margin:12px 14px;border:1px dashed #b7afe8;border-radius:10px;padding:11px;text-align:center;color:var(--pri);font-size:13px;font-weight:600;background:#faf9ff}
.ovl{position:fixed;inset:0;background:rgba(20,16,40,.45);display:none;align-items:flex-end;z-index:20}
.ovl.show{display:flex}
.sheet{background:var(--surf);width:100%;border-radius:16px 16px 0 0;padding:16px 16px 22px;max-height:82vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:17px}
.rev{border:1px solid var(--line);border-radius:10px;padding:2px 12px;margin-bottom:10px}
.rev .r{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid #f0ebe0}.rev .r:last-child{border-bottom:none}
.alert{display:flex;gap:8px;font-size:12px;background:var(--amberbg);color:var(--amber);border-radius:9px;padding:9px 11px;margin-bottom:10px}
.bigsave{width:100%;background:var(--pri);color:#fff;border:none;border-radius:11px;padding:14px;font-size:15px;font-weight:700}
.okscr{padding:64px 26px;text-align:center}.okscr .c{width:64px;height:64px;border-radius:50%;background:var(--okbg);display:inline-flex;align-items:center;justify-content:center;color:var(--ok);margin-bottom:14px}
.okscr h2{margin:0 0 6px}.okscr p{color:var(--ink2);font-size:14px;margin:0}
.pick{padding:14px}.pick a{display:flex;justify-content:space-between;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:10px;text-decoration:none;color:var(--ink)}
.pick .n{font-weight:600;color:var(--pri2)}
svg.ic{vertical-align:-3px}
</style></head><body>
<div id="root"><div class="state">Carregando…</div></div>
<script>
var FN='https://djguxdgaobtminatxkdr.supabase.co/functions/v1/entrada-campo';
var qs=new URLSearchParams(location.search);
var TOKEN=qs.get('t')||'ex-campo-2026';
var BQR=qs.get('b')||''; var ESTOQUE=qs.get('e')||'Almox. Móvel · Frente 1';
var BOLSA=null, ITENS=[], BUSCA='';
var COUNTS={}, DET={}, FOTO={}, EXPAND={};
var DKEY='ex_bolsa_'+BQR;
try{ var sv=JSON.parse(localStorage.getItem(DKEY)||'{}'); COUNTS=sv.c||{}; DET=sv.d||{}; FOTO=sv.f||{}; }catch(e){}
function saveDraft(){ try{ localStorage.setItem(DKEY,JSON.stringify({c:COUNTS,d:DET,f:FOTO})); }catch(e){} }
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function api(path,opt){ opt=opt||{}; opt.headers=Object.assign({'x-token':TOKEN},opt.headers||{}); return fetch(FN+path,opt).then(function(r){return r.json();}); }

function boot(){
  if(BQR){ loadBolsa(); } else { loadPick(); }
}
function loadBolsa(){
  api('?action=bolsa&b='+encodeURIComponent(BQR)).then(function(d){
    if(d.error) throw new Error(d.error);
    BOLSA=d.bolsa; ITENS=d.itens||[]; render();
  }).catch(function(e){ document.getElementById('root').innerHTML='<div class="state">Não carregou ('+esc(e.message)+').</div>'; });
}
function loadPick(){
  api('?action=estrutura&estoque='+encodeURIComponent(ESTOQUE)).then(function(d){
    if(d.error) throw new Error(d.error);
    var bs=d.bolsas||[];
    var html='<div class="hd"><div class="t">'+esc(d.estoque.nome)+'</div><div class="m">escolha a bolsa</div></div><div class="pick">';
    if(!bs.length) html+='<div class="state">Nenhuma bolsa criada ainda.</div>';
    html+=bs.map(function(b){return '<a href="?b='+b.qr+'&t='+TOKEN+'"><span><span class="n">'+esc(b.numero)+'</span> · '+esc(b.grupo||'')+(b.subgrupo?(' / '+esc(b.subgrupo)):'')+'</span><span>›</span></a>';}).join('');
    html+='</div>';
    document.getElementById('root').innerHTML=html;
  }).catch(function(e){ document.getElementById('root').innerHTML='<div class="state">Erro: '+esc(e.message)+'</div>'; });
}
function q(id){return COUNTS[id]||0;}
function setQ(id,v){ v=Math.max(0,v); if(v)COUNTS[id]=v; else delete COUNTS[id]; saveDraft(); upRow(id); upFoot(); }
function inc(id){setQ(id,q(id)+1);} function dec(id){setQ(id,q(id)-1);}
function toggle(id){ EXPAND[id]=!EXPAND[id]; var el=document.getElementById('det_'+id); if(el)el.classList.toggle('show',!!EXPAND[id]); }

function render(){
  var b=BOLSA;
  var html='<div class="hd">'+
    '<a class="bk" href="?e='+encodeURIComponent(b.estoque||'')+'&t='+TOKEN+'">‹ bolsas</a>'+
    '<div class="t">'+esc(b.numero)+' · '+esc(b.grupo||'')+(b.subgrupo?(' › '+esc(b.subgrupo)):'')+'</div>'+
    '<div class="m">'+esc(b.estoque||'')+' — conte o que há nesta bolsa</div>'+
    '<div class="prog"><i id="pbar"></i></div><div class="pl"><span>lançados</span><span id="pl"></span></div></div>'+
    '<div class="tools"><input class="srch" id="srch" placeholder="Buscar nesta bolsa…"></div>'+
    '<div id="list"></div>'+
    '<div class="newb" onclick="novoItem()">+ Não achou? Item novo</div>'+
    '<div style="height:74px"></div>'+
    '<div class="foot"><div class="n"><b id="fi">0</b> itens · <b id="fu">0</b> un</div>'+
      '<button class="btn" onclick="review()"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12.5l5 5 11-11"/></svg> Salvar</button></div>'+
    '<div class="ovl" id="ovl"><div class="sheet" id="sheet"></div></div>';
  document.getElementById('root').innerHTML=html;
  document.getElementById('srch').addEventListener('input',function(e){BUSCA=e.target.value.toLowerCase().trim();renderList();});
  renderList(); upFoot();
}
function vis(){ return ITENS.filter(function(m){ if(!BUSCA)return true; return (m.descricao+' '+(m.codigo||'')+' '+(m.marca||'')).toLowerCase().indexOf(BUSCA)>=0; }); }
function detFields(m){
  var c=m.categoria||'material'; var d=DET[m.id]||{};
  var f='<label class="fotob'+(FOTO[m.id]?' ok':'')+'" id="fb_'+m.id+'"><input type="file" accept="image/*" capture="environment" style="display:none" onchange="foto(\''+m.id+'\',this)">'+
    (FOTO[m.id]?('<img class="thumb" src="'+FOTO[m.id].thumb+'">'):'📷')+' '+(FOTO[m.id]?'foto ok':'Foto')+'</label>'+
    ' <span class="aib" onclick="alert(\'A IA da foto entra no próximo passo (Bloco B).\')">✦ Foto → IA</span>';
  var extra='';
  if(c==='epi'||c==='uniforme'){ extra='<div class="r"><input placeholder="CA" value="'+esc(d.ca||'')+'" oninput="setDet(\''+m.id+'\',\'ca\',this.value)"><input placeholder="Validade (dd/mm/aaaa)" value="'+esc(d.validade_ca||'')+'" oninput="setDet(\''+m.id+'\',\'validade_ca\',this.value)"><input placeholder="Tamanho" value="'+esc(d.tamanho||'')+'" oninput="setDet(\''+m.id+'\',\'tamanho\',this.value)"></div>'; }
  else if(c==='ferramenta'){ extra='<div class="r"><input placeholder="Nº de série / patrimônio" value="'+esc(d.serial||'')+'" oninput="setDet(\''+m.id+'\',\'serial\',this.value)"></div>'; }
  return '<div class="r">'+f+'</div>'+extra;
}
function rowHTML(m){
  var on=q(m.id)>0;
  return '<div class="it'+(on?' on':'')+'" id="row_'+m.id+'">'+
    '<div class="itr"><div class="info" onclick="toggle(\''+m.id+'\')"><div class="nm">'+esc(m.descricao)+(FOTO[m.id]?' <span class="chk">✓foto</span>':'')+'</div><div class="cd">'+esc(m.codigo||'')+(m.unidade?(' · '+esc(m.unidade)):'')+(m.saldo?(' · saldo '+m.saldo):'')+'</div></div>'+
    '<div class="stp"><button onclick="dec(\''+m.id+'\')">−</button><div class="q" id="q_'+m.id+'">'+q(m.id)+'</div><button onclick="inc(\''+m.id+'\')">+</button></div></div>'+
    '<div class="det'+(EXPAND[m.id]?' show':'')+'" id="det_'+m.id+'">'+detFields(m)+'</div></div>';
}
function renderList(){
  var v=vis(); var box=document.getElementById('list');
  box.innerHTML=v.length? v.map(rowHTML).join('') : '<div class="state">Nenhum item nesta bolsa'+(BUSCA?' p/ a busca':'')+'.</div>';
}
function setDet(id,k,val){ DET[id]=DET[id]||{}; DET[id][k]=val; saveDraft(); }
function upRow(id){ var qd=document.getElementById('q_'+id); var row=document.getElementById('row_'+id); if(qd)qd.textContent=q(id); if(row)row.classList.toggle('on',q(id)>0); }
function upFoot(){ var it=0,un=0; Object.keys(COUNTS).forEach(function(k){ if(COUNTS[k]>0){it++;un+=COUNTS[k];} });
  var fi=document.getElementById('fi'),fu=document.getElementById('fu'); if(fi)fi.textContent=it; if(fu)fu.textContent=un;
  var pl=document.getElementById('pl'),pb=document.getElementById('pbar'); if(pl)pl.textContent=it+' de '+ITENS.length; if(pb)pb.style.width=(ITENS.length?Math.round(it/ITENS.length*100):0)+'%'; }

function compress(file,cb){
  var img=new Image(); var rd=new FileReader();
  rd.onload=function(){ img.onload=function(){ var mx=1280; var s=Math.min(1,mx/Math.max(img.width,img.height)); var c=document.createElement('canvas'); c.width=img.width*s; c.height=img.height*s; c.getContext('2d').drawImage(img,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',0.7)); }; img.src=rd.result; };
  rd.readAsDataURL(file);
}
function foto(id,input){
  var f=input.files&&input.files[0]; if(!f)return;
  var fb=document.getElementById('fb_'+id); if(fb)fb.innerHTML='enviando…';
  compress(f,function(dataUrl){
    FOTO[id]={thumb:dataUrl}; // provisório
    api('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'foto',base64:dataUrl,pasta:(BOLSA&&BOLSA.numero)||'bolsa'})}).then(function(d){
      if(d.error) throw new Error(d.error);
      FOTO[id]={path:d.path,url:d.url,thumb:dataUrl}; saveDraft(); renderList(); EXPAND[id]=true; var el=document.getElementById('det_'+id); if(el)el.classList.add('show');
    }).catch(function(e){ delete FOTO[id]; alert('Foto não subiu: '+e.message); renderList(); });
  });
}
function novoItem(){
  var nome=prompt('Descrição do item novo (será cadastrado neste grupo/subgrupo):'); if(!nome)return;
  api('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'cadastrar_material',descricao:nome,grupo_material_id:BOLSA.grupo_id,subgrupo:BOLSA.subgrupo,categoria:catDoGrupo()})}).then(function(d){
    if(d.error) throw new Error(d.error); ITENS.push(d.material); COUNTS[d.material.id]=1; saveDraft(); renderList(); upFoot();
  }).catch(function(e){ alert('Erro: '+e.message); });
}
function catDoGrupo(){ var c=ITENS[0]&&ITENS[0].categoria; return c||'material'; }

function review(){
  var it=0,un=0,semFoto=0; Object.keys(COUNTS).forEach(function(k){ if(COUNTS[k]>0){it++;un+=COUNTS[k]; if(!FOTO[k])semFoto++;} });
  if(!it){ alert('Lance ao menos um item.'); return; }
  var sh=document.getElementById('sheet');
  sh.innerHTML='<h3>Revisar e salvar</h3><div class="rev"><div class="r"><span>Bolsa</span><b>'+esc(BOLSA.numero)+'</b></div><div class="r"><span>Itens lançados</span><b>'+it+'</b></div><div class="r"><span>Unidades</span><b>'+un+'</b></div></div>'+
    (semFoto?'<div class="alert">⚠ '+semFoto+' item(ns) sem foto. Pode salvar mesmo assim.</div>':'')+
    '<button class="bigsave" onclick="salvar()">Salvar entrada da bolsa</button>'+
    '<div style="text-align:center;margin-top:10px"><a href="#" onclick="document.getElementById(\'ovl\').classList.remove(\'show\');return false" style="color:var(--ink3);font-size:13px">voltar</a></div>';
  document.getElementById('ovl').classList.add('show');
}
function salvar(){
  var itens=[]; Object.keys(COUNTS).forEach(function(k){ if(COUNTS[k]>0){ var d=DET[k]||{}; var fo=FOTO[k]; itens.push({material_id:k,quantidade:COUNTS[k],ca:d.ca||null,validade_ca:d.validade_ca||null,tamanho:d.tamanho||null,serial:d.serial||null,foto:fo?fo.path:null}); } });
  var sh=document.getElementById('sheet'); sh.querySelector('.bigsave').disabled=true; sh.querySelector('.bigsave').textContent='Salvando…';
  api('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'salvar',b:BQR,itens:itens})}).then(function(d){
    if(d.error) throw new Error(d.error); try{localStorage.removeItem(DKEY);}catch(e){}
    document.getElementById('root').innerHTML='<div class="okscr"><div class="c">✓</div><h2>Bolsa salva</h2><p>'+d.itens+' itens · '+d.unidades+' unidades<br><b>'+esc(BOLSA.numero+' · '+(BOLSA.grupo||''))+'</b></p></div>';
  }).catch(function(e){ var bs=sh.querySelector('.bigsave'); bs.disabled=false; bs.textContent='Salvar entrada da bolsa'; alert('Erro: '+e.message); });
}
boot();
</script>
</body></html>
