<!doctype html><html lang="pt-br"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Entrada de campo · eX</title>
<style>
:root{--pri:#533ab7;--pri2:#3a2b86;--ink:#1b1a17;--ink2:#5f5d57;--ink3:#8c8981;--line:#e4dfd4;--bg:#faf8f4;--surf:#fff;--ok:#2c6e12;--okbg:#eaf5df}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.top{position:sticky;top:0;z-index:5}
.link{background:#221b40;color:#cfc7ee;font-size:11px;font-family:ui-monospace,monospace;padding:6px 14px;display:flex;align-items:center;gap:6px}
.hd{background:var(--pri);color:#fff;padding:13px 15px}
.hd .t{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.hd .meta{font-size:12px;color:#d7d0f2;margin-top:3px}
.prog{margin-top:10px;background:rgba(255,255,255,.22);border-radius:20px;height:7px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#c7f299;transition:width .3s}
.prog-l{display:flex;justify-content:space-between;font-size:11px;color:#e7e2f7;margin-top:4px}
.tools{background:var(--bg);padding:10px 14px 4px}
.srch{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--surf)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{font-size:12px;padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:var(--surf);color:var(--ink2);white-space:nowrap;cursor:pointer}
.chip.on{background:#eeedfe;border-color:#b7afe8;color:var(--pri2);font-weight:600}
.grp{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);padding:15px 15px 6px;font-weight:600}
.it{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid #efeadf;background:var(--surf)}
.it.filled{background:var(--okbg)}
.info{flex:1;min-width:0}
.nm{font-size:14px;font-weight:500;line-height:1.25}
.cd{font-size:11px;color:var(--ink3);font-family:ui-monospace,monospace}
.stp{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surf);flex:none}
.stp button{width:40px;height:40px;border:none;background:var(--surf);font-size:22px;color:var(--pri);line-height:1;cursor:pointer}
.stp button:active{background:#f1eefb}
.stp .q{width:44px;text-align:center;font-weight:700;font-size:16px;border-left:1px solid #efeadf;border-right:1px solid #efeadf;height:40px;line-height:40px;font-variant-numeric:tabular-nums}
.it.filled .q{color:var(--ok)}
.foot{position:sticky;bottom:0;background:var(--surf);border-top:1px solid var(--line);padding:11px 14px;display:flex;align-items:center;gap:10px}
.foot .n{font-size:12.5px;color:var(--ink2)}
.foot .n b{color:var(--ink)}
.btn{margin-left:auto;background:var(--pri);color:#fff;border:none;border-radius:11px;padding:13px 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.btn:disabled{opacity:.5}
.state{padding:60px 26px;text-align:center;color:var(--ink2)}
.state svg{width:44px;height:44px;color:var(--pri);margin-bottom:12px}
.ok-scr{padding:70px 26px;text-align:center}
.ok-scr .c{width:64px;height:64px;border-radius:50%;background:var(--okbg);display:inline-flex;align-items:center;justify-content:center;color:var(--ok);margin-bottom:16px}
.ok-scr h2{margin:0 0 6px;font-size:20px}
.ok-scr p{margin:0;color:var(--ink2);font-size:14px}
svg.ic{vertical-align:-4px}
</style></head><body>
<div id="root"><div class="state"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 21V9l9-5 9 5v12"/><path d="M7 21v-6h10v6"/></svg><div>Carregando itens…</div></div></div>
<script>
var FN='https://djguxdgaobtminatxkdr.supabase.co/functions/v1/entrada-campo';
var qs=new URLSearchParams(location.search);
var TOKEN=qs.get('t')||'ex-campo-2026';
var ESTOQUE=(qs.get('e')||'Almox. Móvel · Frente 1');
var DKEY='ex_entrada_'+ESTOQUE;
var ITENS=[], COUNTS={}, FILTRO='todos', BUSCA='';
var CATS=[['ferramenta','Ferramentas'],['epi','EPIs'],['uniforme','Uniformes'],['material','Materiais'],['consumivel','Consumíveis']];
var CATLBL={ferramenta:'Ferramentas',epi:'EPIs',uniforme:'Uniformes',material:'Materiais',consumivel:'Consumíveis'};

try{ COUNTS=JSON.parse(localStorage.getItem(DKEY)||'{}')||{}; }catch(e){ COUNTS={}; }
function saveDraft(){ try{ localStorage.setItem(DKEY, JSON.stringify(COUNTS)); }catch(e){} }
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function load(){
  fetch(FN+'?t='+encodeURIComponent(TOKEN),{headers:{'x-token':TOKEN}})
   .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
   .then(function(d){ if(d.error) throw new Error(d.error); ITENS=d.itens||[]; render(); })
   .catch(function(e){ document.getElementById('root').innerHTML='<div class="state">Não consegui carregar ('+esc(e.message)+').<br>Confira o link e tente de novo.</div>'; });
}
function q(id){ return COUNTS[id]||0; }
function setQ(id,v){ v=Math.max(0,v); if(v)COUNTS[id]=v; else delete COUNTS[id]; saveDraft(); updateRow(id); updateFoot(); }
function inc(id){ setQ(id,q(id)+1); }
function dec(id){ setQ(id,q(id)-1); }

function render(){
  var root=document.getElementById('root');
  var chips='<span class="chip'+(FILTRO==='todos'?' on':'')+'" data-f="todos">Todos</span>'+
    CATS.map(function(c){ return '<span class="chip'+(FILTRO===c[0]?' on':'')+'" data-f="'+c[0]+'">'+c[1]+'</span>'; }).join('');
  var html=''+
   '<div class="top">'+
     '<div class="link"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.5 14.5l5-5"/><path d="M11 6.5l1-1a4 4 0 015.7 5.7l-1 1"/><path d="M13 17.5l-1 1a4 4 0 01-5.7-5.7l1-1"/></svg> entrada de campo · eX</div>'+
     '<div class="hd">'+
       '<div class="t"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 21V9l9-5 9 5v12"/><path d="M7 21v-6h10v6"/></svg> '+esc(ESTOQUE)+'</div>'+
       '<div class="meta">conte o que há hoje — vira o saldo real deste estoque</div>'+
       '<div class="prog"><i id="pbar"></i></div>'+
       '<div class="prog-l"><span>lançados</span><span id="pl"></span></div>'+
     '</div>'+
     '<div class="tools"><input class="srch" id="srch" placeholder="Buscar item…"><div class="chips" id="chips">'+chips+'</div></div>'+
   '</div>'+
   '<div id="list"></div>'+
   '<div style="height:70px"></div>'+
   '<div class="foot"><div class="n"><b id="fi">0</b> itens · <b id="fu">0</b> un</div>'+
     '<button class="btn" id="save"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12.5l5 5 11-11"/></svg> Salvar</button></div>';
  root.innerHTML=html;
  document.getElementById('srch').addEventListener('input',function(e){ BUSCA=e.target.value.toLowerCase().trim(); renderList(); });
  document.getElementById('chips').addEventListener('click',function(e){ var c=e.target.closest('.chip'); if(!c)return; FILTRO=c.getAttribute('data-f'); document.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('on',x===c);}); renderList(); });
  document.getElementById('save').addEventListener('click',salvar);
  renderList(); updateFoot();
}
function visiveis(){
  return ITENS.filter(function(m){
    if(FILTRO!=='todos' && (m.categoria||'material')!==FILTRO) return false;
    if(BUSCA){ var s=(m.descricao+' '+(m.codigo||'')+' '+(m.marca||'')+' '+(m.grupo||'')).toLowerCase(); if(s.indexOf(BUSCA)<0) return false; }
    return true;
  });
}
function rowHTML(m){
  var f=q(m.id)>0;
  return '<div class="it'+(f?' filled':'')+'" id="row_'+m.id+'">'+
    '<div class="info"><div class="nm">'+esc(m.descricao)+'</div><div class="cd">'+esc(m.codigo||'')+(m.unidade?' · '+esc(m.unidade):'')+'</div></div>'+
    '<div class="stp"><button onclick="dec(\''+m.id+'\')">−</button><div class="q" id="q_'+m.id+'">'+q(m.id)+'</div><button onclick="inc(\''+m.id+'\')">+</button></div>'+
   '</div>';
}
function renderList(){
  var list=document.getElementById('list'); var vis=visiveis();
  var order=['ferramenta','epi','uniforme','material','consumivel',''];
  var byc={}; vis.forEach(function(m){ var c=m.categoria||'material'; (byc[c]=byc[c]||[]).push(m); });
  var html='';
  order.forEach(function(c){ var arr=byc[c]; if(!arr||!arr.length)return; html+='<div class="grp">'+(CATLBL[c]||'Outros')+' · '+arr.length+'</div>'+arr.map(rowHTML).join(''); });
  list.innerHTML=html || '<div class="state">Nenhum item encontrado.</div>';
}
function updateRow(id){ var qd=document.getElementById('q_'+id); var row=document.getElementById('row_'+id); if(qd)qd.textContent=q(id); if(row)row.classList.toggle('filled',q(id)>0); }
function updateFoot(){
  var itens=0, un=0; Object.keys(COUNTS).forEach(function(k){ if(COUNTS[k]>0){ itens++; un+=COUNTS[k]; } });
  var fi=document.getElementById('fi'), fu=document.getElementById('fu'); if(fi)fi.textContent=itens; if(fu)fu.textContent=un;
  var pl=document.getElementById('pl'), pb=document.getElementById('pbar');
  if(pl)pl.textContent=itens+' de '+ITENS.length+' itens';
  if(pb)pb.style.width=(ITENS.length? Math.round(itens/ITENS.length*100):0)+'%';
}
function salvar(){
  var itens=[]; Object.keys(COUNTS).forEach(function(k){ if(COUNTS[k]>0) itens.push({material_id:k, quantidade:COUNTS[k]}); });
  if(!itens.length){ alert('Lance ao menos um item.'); return; }
  var btn=document.getElementById('save'); btn.disabled=true; btn.textContent='Salvando…';
  fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','x-token':TOKEN},body:JSON.stringify({estoque:ESTOQUE,itens:itens})})
   .then(function(r){ return r.json(); })
   .then(function(d){ if(d.error) throw new Error(d.error);
     try{ localStorage.removeItem(DKEY); }catch(e){}
     document.getElementById('root').innerHTML='<div class="ok-scr"><div class="c"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 12.5l5 5 11-11"/></svg></div><h2>Entrada registrada</h2><p>'+d.itens+' itens · '+d.unidades+' unidades no estoque<br><b>'+esc(ESTOQUE)+'</b></p></div>';
   })
   .catch(function(e){ btn.disabled=false; btn.innerHTML='Salvar'; alert('Erro ao salvar: '+e.message); });
}
load();
</script>
</body></html>
