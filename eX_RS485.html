<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>eX · Cadastro da Rede RS485</title>
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#f3f5f7;--panel:#fff;--fg:#1b2530;--muted:#5d6b78;--line:#d5dce3;--chip:#eef1f4;--ac:#534AB7;--ac2:#7F77DD;--acbg:#EEEDFE;--acdk:#26215C;--acfg:#3C3489;
--ok:#1f7a43;--okbg:#d9f2e2;--warn:#8a6a00;--warnbg:#fbefc8;--bad:#b3261e;--badbg:#fadcd9;
--f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--f-mono:ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.35;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{padding:0 max(12px,env(safe-area-inset-left,0px));max-width:760px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header .wrap{padding-top:10px;padding-bottom:10px;display:grid;gap:6px}
h1{font-size:17px;margin:0}
.sub{font-size:12px;color:var(--muted)}
.aval{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:600}
main{display:grid;gap:14px;padding-top:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.lbl{display:grid;gap:3px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%;text-transform:none;letter-spacing:0;font-weight:400}
textarea{min-height:56px;resize:vertical}
.porta{border-radius:14px;background:var(--acbg);padding:12px;display:grid;gap:0}
.ph{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin-bottom:10px}
.ph .t{font-weight:800;font-size:17px;color:var(--acfg);text-transform:uppercase;letter-spacing:.03em}
.ph .s{grid-column:1/-1;font-size:12px;color:var(--acfg)}
.pt{background:var(--panel);border:2px solid var(--ac2);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.pt.org{border-style:solid;background:var(--acdk);color:#fff;border-color:var(--acdk)}
.pt .n{font-family:var(--f-mono);font-weight:700;font-size:16px}
.pt .d{font-size:12px;color:var(--muted)}.pt.org .d{color:#CECBF6}
.ptrow{display:grid;grid-template-columns:1fr 92px;gap:8px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.mini{font:inherit;font-size:13px;font-weight:600;min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);cursor:pointer}
.mini.del{color:var(--bad);border-color:var(--badbg)}
.tr{margin-left:20px;border-left:4px solid var(--ac2);padding:12px 0 12px 14px;display:grid;gap:8px}
.trh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{font-family:var(--f-mono);font-weight:700;background:var(--acdk);color:#fff;padding:3px 9px;border-radius:6px;font-size:14px}
.de{font-size:13px;font-weight:600;color:var(--acfg)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:15px;font-weight:600;min-height:42px;border:0;background:var(--panel);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--acdk);color:#fff}
.av{font-size:12px;border-radius:6px;padding:6px 8px}
.av.w{background:var(--warnbg);color:var(--warn)}.av.b{background:var(--badbg);color:var(--bad)}.av.o{background:var(--okbg);color:var(--ok)}
.add{font:inherit;font-weight:800;font-size:15px;min-height:52px;margin-top:12px;border:2px dashed var(--ac2);border-radius:12px;background:transparent;color:var(--acfg);cursor:pointer;letter-spacing:.02em}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.k{background:var(--chip);border-radius:8px;padding:8px 10px}.k b{display:block;font-family:var(--f-mono);font-size:18px}.k span{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}td.r,th.r{text-align:right}
td input{min-height:34px;padding:4px 6px;font-size:14px;width:80px;text-align:right}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--panel);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.sheet h3{margin:0;font-size:18px}
.opt{font:inherit;text-align:left;display:grid;gap:2px;width:100%;min-height:52px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);cursor:pointer}
.opt b{font-family:var(--f-mono)}.opt span{font-size:12px;color:var(--muted)}
.opt.used{opacity:.45}
.gt{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-top:6px}
.b{font:inherit;font-weight:700;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.b.p{background:var(--acdk);color:#fff;border-color:var(--acdk)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50}
#des svg{width:100%;height:auto;display:block}
.grp{border-radius:10px;padding:10px;display:grid;gap:8px;border:1px solid var(--line)}
.grp .gh{display:flex;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.03em}.grp .gh span{font-family:var(--f-mono)}
.grp.inf{background:#FAEEDA;border-color:#EF9F27}.grp.inf .gh{color:#633806}
.grp.cab{background:#E6F1FB;border-color:#85B7EB}.grp.cab .gh{color:#0C447C}
.addr{display:grid;justify-items:center;align-content:center;background:var(--acbg);border-radius:8px;padding:4px 6px;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--acfg)}.addr b{font-family:var(--f-mono);font-size:22px}
.etapas{background:var(--chip);border-radius:8px;padding:8px 10px;display:grid;gap:4px}
.et{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-top:1px solid var(--line);padding-top:4px}
.et b{font-family:var(--f-mono);white-space:nowrap}
.terms{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tm{font:inherit;font-size:13px;font-weight:600;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);cursor:pointer}
.tm.on{background:var(--acdk);color:#fff;border-color:var(--acdk)}.tm:disabled{opacity:.4}
.passo{display:flex;gap:10px;align-items:flex-start;font-size:14px}.passo i{font-style:normal;font-weight:800;background:var(--acdk);color:#fff;border-radius:50%;min-width:24px;height:24px;display:grid;place-items:center;font-size:13px}
@media print{header,.aval,.tools,.add,.noprint{display:none!important}body{background:#fff}.box,.porta{break-inside:avoid}}
</style></head><body>
<header><div class="wrap">
 <h1>eX · Cadastro da Rede RS485</h1>
 <div class="sub" id="hsub">Levantamento ponto a ponto a partir do X-WEB</div>
</div></header>
<main class="wrap" id="main"></main>
<div class="sheet" id="sheet" hidden><div id="sheetc"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
/* ---- siglas da legenda (Base do Sistema · categoria Rede RS485) ---- */
const SIG=[
 ["Medidores","MM-SV1","Multimedidor · Salão de vendas 1"],["Medidores","MM-SV2","Multimedidor · Salão de vendas 2"],["Medidores","MM-SV3","Multimedidor · Salão de vendas 3"],
 ["Medidores","MM-D&D","Multimedidor · Docas e Depósito"],["Medidores","MM-QGBT","Multimedidor · QGBT"],["Medidores","MM-QGBT2","Multimedidor · QGBT 2 (loja com 2 QGBTs)"],["Medidores","MM-SPL","Multimedidor · Splitões (QFAC)"],
 ["Medidores","MM-CH","Multimedidor · Chiller (QD-CAG)"],["Medidores","MM-FC","Multimedidor · Fancoils (QD-CAG)"],
 ["Controladores","IPG215D-IL-SV1","iPro Genius · Iluminação SV1"],["Controladores","IPG215D-IL-SV2","iPro Genius · Iluminação SV2"],["Controladores","IPG215D-IL-SV3","iPro Genius · Iluminação SV3"],
 ["Controladores","IPG215D-IL-D&D","iPro Genius · Iluminação Docas e Depósito"],["Controladores","IPG215D-SPL","iPro Genius · Splitão"],["Controladores","IPX215D-SPL","Expansão · Splitão convencional"],
 ["Controladores","IPG215D-CH","iPro Genius · Chiller"],["Controladores","IPX215D-CH","Expansão · Chiller"],
 ["Conversores","AC60101","Conversor p/ termostatos Modbus · leva os termostatos junto"]];
const REPETE=new Set(["AC60101"]);const MAXT=10;
/* endereçamento padrão por sigla (sugestão inicial — ajustar na base) */
const END0={"MM-QGBT":1,"MM-QGBT2":2,"MM-SPL":3,"MM-CH":4,"MM-FC":5,"MM-SV1":11,"MM-SV2":12,"MM-SV3":13,"MM-D&D":14,"IPG215D-IL-SV1":21,"IPG215D-IL-SV2":22,"IPG215D-IL-SV3":23,"IPG215D-IL-D&D":24,"IPG215D-SPL":31,"IPX215D-SPL":32,"IPG215D-CH":33,"IPX215D-CH":34,"AC60101":41};
const DESC=Object.fromEntries(SIG.map(s=>[s[1],s[2]]));
/* ---- tempos padrão (base, editáveis) ---- */
const TP0=[["inf_baixa","Infra nova baixa",3,"min/m"],["inf_alta","Infra nova alta",6,"min/m"],["inf_alta_tr","Trecho em altura (infra nova ou existente) · posicionar plataforma",30,"min/trecho"],["lanc","Lançamento do cabo",2,"min/m"],["exist","Trecho existente · checagem",10,"min/trecho"],["lig","Ponto · 1. Ligação do cabo no dispositivo (entrada + saída)",15,"min/ponto"],["end","Ponto · 2. Endereçamento",15,"min/ponto"],["vint","Ponto · 3. Validação interna eX",10,"min/ponto"],["com","Comissionamento do barramento",120,"min/rede"],["val","Validação Copeland",30,"min/rede"]];
const K="ex_rs485_aval_v1";
let S;try{S=JSON.parse(localStorage.getItem(K)||"null")}catch(_){S=null}
if(!S)S={loja:"935 · Aparecida de Goiânia · Vera Cruz",lider:"",p:{1:[],2:[]},tp:Object.fromEntries(TP0.map(x=>[x[0],x[2]]))};
S.end=Object.assign({},END0,S.end||{});TP0.forEach(x=>{if(S.tp[x[0]]==null)S.tp[x[0]]=x[2]});[1,2].forEach(p=>S.p[p].forEach(x=>{if(x.iex!=null&&x.iexb==null){x.iexb=x.iex;x.iexa=""}delete x.iex}));[1,2].forEach(p=>S.p[p]=S.p[p].filter(x=>(x.base||x.sig)!=="TERM-RS485"));
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n=v=>Math.max(0,+String(v??"").replace(",",".")||0);
function salvar(){try{localStorage.setItem(K,JSON.stringify(S))}catch(_){}}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,1800)}
const uid=()=>Math.random().toString(36).slice(2,9);
function addrOf(t){const b=t.base||t.sig,a=+S.end[b]||0;if(!a)return "";if(REPETE.has(b)){const k=+(String(t.sig).split("-").pop())||1;return a+k-1}return a}
const num=(p,i)=>`P${p}-${String(i+1).padStart(2,"0")}`;
const orig=(p,i)=>i===0?`X-WEB P${p}`:S.p[p][i-1].sig;
/* ---- cálculos ---- */
function tempoTrecho(t){const T=S.tp;if(t.existe)return T.exist;let m=n(t.baixa)*T.inf_baixa+n(t.alta)*T.inf_alta+((n(t.alta)+n(t.iexa))>0?T.inf_alta_tr:0)+n(t.cabo)*T.lanc;return m}
function totais(){let o={pontos:0,trechos:0,cabo:0,ieb:0,iea:0,ib:0,ia:0,min:0};
 [1,2].forEach(p=>S.p[p].forEach(x=>{o.pontos++;o.trechos++;o.cabo+=n(x.cabo);o.ieb+=n(x.iexb);o.iea+=n(x.iexa);o.ib+=n(x.baixa);o.ia+=n(x.alta);o.min+=tempoTrecho(x)+S.tp.lig+S.tp.end+S.tp.vint;o.terms=(o.terms||0)+(x.terms||[]).length}));
 if(o.pontos)o.min+=S.tp.com+S.tp.val;return o}
const fmtH=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?`${h}h${String(r).padStart(2,"0")}`:`${r} min`};
function avisos(p,i){const t=S.p[p][i],a=[];
 if(!t.existe){const inf=n(t.iexb)+n(t.iexa)+n(t.baixa)+n(t.alta);if(!n(t.cabo))a.push(["w","Falta a metragem total do cabo"]);else if(inf>n(t.cabo))a.push(["b",`Infra (${inf} m) maior que o cabo (${n(t.cabo)} m). Confira.`]);else if(inf<n(t.cabo))a.push(["w",`${(n(t.cabo)-inf).toFixed(1).replace(".0","")} m de cabo sem infra informada`])}
 const ad=addrOf(t);if(ad===""){a.push(["w","Sigla sem endereço padrão na base"])}else{const dup=[1,2].flatMap(q=>S.p[q]).filter(x=>x!==t&&String(addrOf(x))===String(ad)).length;if(dup)a.push(["b",`Endereço ${ad} repetido na rede · ajuste a tabela de endereços`])}
 return a}
/* ---- render ---- */
function render(){
 const o=totais();$("#hsub").textContent=`${S.loja} · ${o.pontos} pontos · ${o.cabo} m de cabo`;
 let h=`<div class="aval">⚠ MODO AVALIAÇÃO — os dados ficam salvos só neste aparelho. Nada vai para o eX Controller ainda.</div>
 <section class="box"><div class="passo"><i>1</i><span>Em cada porta do X-WEB, toque em <b>“+ ADICIONAR PRÓXIMO PONTO”</b> e escolha a sigla da lista.</span></div>
 <div class="passo"><i>2</i><span>O cabo entre dois pontos é criado sozinho e já numerado (P1-01, P1-02…), e o endereço do dispositivo vem automático pela sigla. Preencha só as metragens de cada trecho.</span></div>
 <div class="passo"><i>3</i><span>Termostato não é ponto da rede: escolha o conversor <b>AC60101</b> e marque nele os termostatos que ele atende.</span></div>
 <div class="passo"><i>4</i><span>No fim da página saem o <b>resumo</b>, o <b>tempo previsto</b> e o <b>desenho</b> com os cabos numerados.</span></div></section>
 <section class="box"><label class="lbl">Loja<input data-s="loja" value="${esc(S.loja)}"></label><label class="lbl">Quem está levantando<input data-s="lider" value="${esc(S.lider)}" placeholder="nome do líder"></label></section>`;
 [1,2].forEach(p=>{const L=S.p[p],cab=L.reduce((a,x)=>a+n(x.cabo),0);
  h+=`<section class="porta"><div class="ph"><span class="t">Porta ${p} do X-WEB</span><span class="mini" style="border:0;background:transparent;color:var(--acfg)">${L.length} ponto${L.length===1?"":"s"} · ${cab} m</span><span class="s">Saída RS485-${p} · dentro do QA do Ar</span></div>
  <div class="pt org"><span class="n">X-WEB · P${p}</span><span class="d">Origem da rede · Supervisório XWEB500D</span></div>`;
  L.forEach((t,i)=>{const av=avisos(p,i);
   h+=`<div class="tr" data-p="${p}" data-i="${i}">
    <div class="trh"><span class="num">${num(p,i)}</span><span class="de">${esc(orig(p,i))} → ${esc(t.sig)}</span></div>
    <label class="lbl">Rede já existe neste trecho?<div class="seg"><button type="button" data-ex="1" class="${t.existe?"on":""}">Sim</button><button type="button" data-ex="0" class="${!t.existe?"on":""}">Não</button></div></label>
    ${t.existe?`<div class="av o">Trecho existente: conta só a checagem (${S.tp.exist} min).</div>`:`<div class="grp inf"><div class="gh">🔧 INFRA DO TRECHO <span>${n(t.iexb)+n(t.iexa)+n(t.baixa)+n(t.alta)} m</span></div>
     <div class="g2"><label class="lbl">Infra existente · baixa (m)<input inputmode="decimal" data-f="iexb" value="${esc(t.iexb)}" placeholder="0"></label>
     <label class="lbl">Infra existente · alta (m)<input inputmode="decimal" data-f="iexa" value="${esc(t.iexa)}" placeholder="0"></label></div>
     <div class="g2"><label class="lbl">Infra nova · baixa (m)<input inputmode="decimal" data-f="baixa" value="${esc(t.baixa)}" placeholder="0"></label>
     <label class="lbl">Infra nova · alta (m)<input inputmode="decimal" data-f="alta" value="${esc(t.alta)}" placeholder="0"></label></div></div>
     <div class="grp cab"><div class="gh">〰 CABO RS485 DO TRECHO <span>${n(t.cabo)} m</span></div>
     <label class="lbl">Metragem total do cabo (m)<input inputmode="decimal" data-f="cabo" value="${esc(t.cabo)}" placeholder="medir"></label></div>`}
    <label class="lbl">Observação do trecho<textarea data-f="obs" placeholder="por onde passa, dificuldade, forro, plataforma…">${esc(t.obs)}</textarea></label>
    ${av.map(x=>`<div class="av ${x[0]}">${esc(x[1])}</div>`).join("")}
    <div class="sub">Tempo previsto do trecho: <b>${fmtH(tempoTrecho(t))}</b></div>
   </div>
   <div class="pt" data-p="${p}" data-i="${i}"><div class="ptrow"><div><span class="n">${esc(t.sig)}</span><div class="d">${esc(DESC[t.base||t.sig]||"")}</div></div>
    <div class="addr"><span>Endereço</span><b>${addrOf(t)||"—"}</b><span>automático</span></div></div>
    ${(t.base||t.sig)==="AC60101"?termHTML(t):""}
    <div class="etapas"><div class="lbl" style="margin-bottom:2px">Etapas deste ponto</div>
     <div class="et"><span>1. Ligação do cabo no dispositivo <span class="sub">(entrada + saída)</span></span><b>${S.tp.lig} min</b></div>
     <div class="et"><span>2. Endereçamento</span><b>${S.tp.end} min</b></div>
     <div class="et"><span>3. Validação interna eX <span class="sub">(supervisório enxerga o dispositivo)</span></span><b>${S.tp.vint} min</b></div>
     <div class="sub">O status de cada etapa é marcado no apontamento de campo, na execução.</div></div>
    <div class="tools"><button type="button" class="mini" data-mv="-1" ${i===0?"disabled":""}>↑ Subir</button><button type="button" class="mini" data-mv="1" ${i===L.length-1?"disabled":""}>↓ Descer</button><button type="button" class="mini" data-troca="1">Trocar sigla</button><button type="button" class="mini del" data-del="1">Remover</button></div></div>`});
  h+=`<button type="button" class="add" data-add="${p}">+ ADICIONAR PRÓXIMO PONTO NA PORTA ${p}</button></section>`});
 h+=`<section class="box"><div style="font-weight:800">RESUMO DA REDE</div><div class="tot">
  <div class="k"><span>Pontos</span><b>${o.pontos}</b></div><div class="k"><span>Trechos (cabos)</span><b>${o.trechos}</b></div>
  <div class="k"><span>Cabo total</span><b>${o.cabo} m</b></div><div class="k"><span>Infra existente baixa</span><b>${o.ieb} m</b></div><div class="k"><span>Infra existente alta</span><b>${o.iea} m</b></div>
  <div class="k"><span>Termostatos (via conversor)</span><b>${o.terms||0}</b></div><div class="k"><span>Validação interna</span><b>${o.pontos} pontos</b></div>
  <div class="k"><span>Infra nova baixa</span><b>${o.ib} m</b></div><div class="k"><span>Infra nova alta</span><b>${o.ia} m</b></div>
  <div class="k" style="grid-column:1/-1;background:var(--acbg)"><span>Tempo previsto da rede</span><b>${fmtH(o.min)}</b></div></div></section>
 <section class="box"><div style="font-weight:800">DESENHO DA REDE · CABOS NUMERADOS</div><div id="des">${desenho()}</div>
  <button type="button" class="b noprint" onclick="window.print()">Imprimir / salvar PDF</button></section>
 <section class="box noprint"><div style="font-weight:800">TEMPOS PADRÃO DA BASE <span class="sub">(editáveis)</span></div>
  <table><tr><th>Etapa</th><th class="r">Tempo</th><th>Unid.</th></tr>${TP0.map(x=>`<tr><td>${x[1]}</td><td class="r"><input inputmode="numeric" data-tp="${x[0]}" value="${S.tp[x[0]]}"></td><td>${x[3]}</td></tr>`).join("")}</table>
  </section><section class="box noprint"><div style="font-weight:800">ENDEREÇAMENTO PADRÃO DA REDE <span class="sub">(editável · vale para todas as lojas)</span></div>
  <div class="sub">O endereço de cada ponto sai desta tabela pela sigla. Conversores AC60101 recebem o endereço base + a sequência (AC60101-1 = base, -2 = base+1…).</div>
  <table><tr><th>Sigla</th><th class="r">Endereço</th></tr>${SIG.map(x=>`<tr><td><b style="font-family:var(--f-mono)">${x[1]}</b> <span class="sub">${x[2]}</span></td><td class="r"><input inputmode="numeric" data-ed="${x[1]}" value="${S.end[x[1]]??""}"></td></tr>`).join("")}</table>
  <button type="button" class="mini del" data-zerar="1">Apagar todo o cadastro deste aparelho</button></section>`;
 const a=document.activeElement,keep=a&&a.dataset&&(a.dataset.f||a.dataset.s||a.dataset.tp||a.dataset.ed)?{f:a.dataset.f,s:a.dataset.s,tp:a.dataset.tp,ed:a.dataset.ed,p:a.closest("[data-p]")&&a.closest("[data-p]").dataset.p,i:a.closest("[data-i]")&&a.closest("[data-i]").dataset.i,pos:a.selectionStart}:null;
 $("#main").innerHTML=h;
 if(keep){let sel=keep.s?`[data-s="${keep.s}"]`:keep.ed?`[data-ed="${keep.ed}"]`:keep.tp?`[data-tp="${keep.tp}"]`:`[data-p="${keep.p}"][data-i="${keep.i}"] [data-f="${keep.f}"]`;const e=document.querySelector(sel);if(e){e.focus();try{e.setSelectionRange(keep.pos,keep.pos)}catch(_){}}}
}
function termHTML(t){const em=new Set([1,2].flatMap(q=>S.p[q]).filter(x=>x!==t).flatMap(x=>x.terms||[]));const sel=new Set(t.terms||[]);
 return `<div class="lbl">Termostatos que este conversor atende <span class="sub" style="text-transform:none">(toque para marcar)</span></div><div class="terms">${Array.from({length:MAXT},(_,k)=>k+1).map(k=>`<button type="button" class="tm ${sel.has(k)?"on":""}" data-term="${k}" ${em.has(k)?"disabled":""}>Termostato ${k}${em.has(k)?" · outro conversor":""}</button>`).join("")}</div>${sel.size?"":'<div class="av w">Marque pelo menos um termostato</div>'}`}
function desenho(){
 const L1=S.p[1],L2=S.p[2],rows=Math.max(L1.length,L2.length,1),H=150+rows*110+20;
 const col=(p,L,cx)=>{let s="";L.forEach((t,i)=>{const y=190+i*110,y0=i===0?140:y-54;
   s+=`<line x1="${cx}" y1="${y0}" x2="${cx}" y2="${y-2}" stroke="#7F77DD" stroke-width="3"/>
   <text x="${cx+12}" y="${y-30}" font-size="12" font-family="ui-monospace,monospace" font-weight="700" fill="#26215C">${num(p,i)}</text>
   <text x="${cx+12}" y="${y-15}" font-size="11" fill="#534AB7">${t.existe?"existente":n(t.cabo)+" m"}</text>
   <rect x="${cx-95}" y="${y}" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
   <text x="${cx}" y="${y+24}" text-anchor="middle" font-size="14" font-weight="700" font-family="ui-monospace,monospace" fill="#26215C">${esc(t.sig)}</text>
   <text x="${cx}" y="${y+42}" text-anchor="middle" font-size="11" fill="#534AB7">end. ${addrOf(t)||"?"}${(t.terms||[]).length?" · Term. "+t.terms.slice().sort((a,b)=>a-b).join(", "):""}</text>`});
  if(!L.length)s+=`<text x="${cx}" y="180" text-anchor="middle" font-size="12" fill="#888">sem pontos</text>`;return s};
 return `<svg viewBox="0 0 680 ${H}" role="img" aria-label="Desenho da rede RS485"><rect x="240" y="20" width="200" height="50" rx="8" fill="#26215C"/><text x="340" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">X-WEB</text><text x="340" y="60" text-anchor="middle" font-size="11" fill="#CECBF6">QA do Ar</text>
 <path d="M300 70 L300 88 L170 88 L170 108" fill="none" stroke="#7F77DD" stroke-width="2"/><path d="M380 70 L380 88 L490 88 L490 108" fill="none" stroke="#7F77DD" stroke-width="2"/>
 <rect x="110" y="110" width="120" height="30" rx="6" fill="#CECBF6"/><text x="170" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#26215C">Porta 1</text>
 <rect x="430" y="110" width="120" height="30" rx="6" fill="#CECBF6"/><text x="490" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#26215C">Porta 2</text>
 ${col(1,L1,170)}${col(2,L2,490)}</svg>`}
/* ---- escolha de sigla ---- */
let ESC=null;
function escolher(p,i){ESC={p,i};const usados=new Set([1,2].flatMap(q=>S.p[q]).map(x=>x.base||x.sig));let g="",h=`<h3>${i==null?`Próximo ponto da porta ${p}`:"Trocar sigla do ponto"}</h3><div class="sub">Escolha o dispositivo. Siglas da legenda da Base do Sistema.</div>`;
 SIG.forEach(s=>{if(s[0]!==g){g=s[0];h+=`<div class="gt">${g}</div>`}const u=usados.has(s[1])&&!REPETE.has(s[1]);h+=`<button type="button" class="opt ${u?"used":""}" data-sig="${s[1]}"><b>${s[1]}</b><span>${s[2]}${u?" · já está na rede":""}</span></button>`});
 h+=`<button type="button" class="b" data-fecha="1">Cancelar</button>`;$("#sheetc").innerHTML=h;$("#sheet").hidden=false}
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet"||e.target.closest("[data-fecha]")){$("#sheet").hidden=true;return}
 const o=e.target.closest("[data-sig]");if(!o||!ESC)return;let base=o.dataset.sig,sig=base;
 if(REPETE.has(base)){const c=[1,2].flatMap(q=>S.p[q]).filter(x=>(x.base||x.sig)===base).length;sig=`${base}-${c+1}`}
 else if([1,2].flatMap(q=>S.p[q]).some(x=>x.sig===base)){toast(base+" já está na rede");return}
 if(ESC.i==null){S.p[ESC.p].push({id:uid(),sig,base,endr:"",existe:false,iexb:"",iexa:"",baixa:"",alta:"",cabo:"",obs:"",terms:[]});toast(`Ponto ${sig} e cabo ${num(ESC.p,S.p[ESC.p].length-1)} criados`)}
 else{const t=S.p[ESC.p][ESC.i];t.sig=sig;t.base=base;if(base!=="AC60101")t.terms=[];toast("Sigla trocada")}
 $("#sheet").hidden=true;salvar();render();
 const last=document.querySelectorAll(`.tr[data-p="${ESC.p}"]`);const el=ESC.i==null?last[last.length-1]:null;if(el)el.scrollIntoView({block:"center",behavior:"smooth"})});
/* ---- eventos ---- */
$("#main").addEventListener("click",e=>{
 const ad=e.target.closest("[data-add]");if(ad){escolher(+ad.dataset.add,null);return}
 if(e.target.closest("[data-zerar]")){$("#sheetc").innerHTML=`<h3>Apagar o cadastro?</h3><div>Isso apaga todos os pontos e trechos salvos neste aparelho.</div><button type="button" class="b p" id="zok" style="background:var(--bad);border-color:var(--bad)">Apagar tudo</button><button type="button" class="b" data-fecha="1">Cancelar</button>`;$("#sheet").hidden=false;$("#zok").onclick=()=>{S.p={1:[],2:[]};salvar();$("#sheet").hidden=true;render();toast("Cadastro apagado")};return}
 const box=e.target.closest("[data-p][data-i]");if(!box)return;const p=+box.dataset.p,i=+box.dataset.i,L=S.p[p],t=L[i];
 const tm=e.target.closest("[data-term]");if(tm){const k=+tm.dataset.term;t.terms=t.terms||[];const ix=t.terms.indexOf(k);if(ix>=0)t.terms.splice(ix,1);else t.terms.push(k);salvar();render();return}
 const ex=e.target.closest("[data-ex]");if(ex){t.existe=ex.dataset.ex==="1";salvar();render();return}
 const mv=e.target.closest("[data-mv]");if(mv){const j=i+(+mv.dataset.mv);if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];salvar();render();toast("Ordem alterada · confira as metragens dos cabos");return}
 if(e.target.closest("[data-troca]")){escolher(p,i);return}
 if(e.target.closest("[data-del]")){$("#sheetc").innerHTML=`<h3>Remover ${esc(t.sig)}?</h3><div>O ponto e o cabo ${num(p,i)} que chega nele saem da rede. Os cabos seguintes são renumerados.</div><button type="button" class="b p" id="dok" style="background:var(--bad);border-color:var(--bad)">Remover</button><button type="button" class="b" data-fecha="1">Cancelar</button>`;$("#sheet").hidden=false;$("#dok").onclick=()=>{L.splice(i,1);salvar();$("#sheet").hidden=true;render();toast("Ponto removido")};return}
});
$("#main").addEventListener("input",e=>{const el=e.target;
 if(el.dataset.s){S[el.dataset.s]=el.value;salvar();$("#hsub").textContent=S.loja;return}
 if(el.dataset.ed){S.end[el.dataset.ed]=n(el.value);salvar();clearTimeout(window._rt);window._rt=setTimeout(render,600);return}
 if(el.dataset.tp){S.tp[el.dataset.tp]=n(el.value);salvar();clearTimeout(window._rt);window._rt=setTimeout(render,600);return}
 const box=el.closest("[data-p][data-i]");if(!box||!el.dataset.f)return;const t=S.p[+box.dataset.p][+box.dataset.i];t[el.dataset.f]=el.value;salvar();
 if(el.dataset.f!=="obs"){clearTimeout(window._rt);window._rt=setTimeout(render,700)}});
render();
</script>
