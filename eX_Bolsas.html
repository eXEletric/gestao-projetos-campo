<!doctype html><html lang="pt-br"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bolsas · eX</title>
<style>
:root{--pri:#533ab7;--pri2:#3a2b86;--ink:#1b1a17;--ink2:#5f5d57;--ink3:#8c8981;--line:#e4dfd4;--bg:#faf8f4;--surf:#fff;--ok:#2c6e12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 3px;display:flex;align-items:center;gap:9px}
.sub{color:var(--ink2);font-size:13px;margin:0 0 18px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:16px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:0 0 12px}
label{font-size:12px;color:var(--ink2);display:block;margin:0 0 4px}
input,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;background:var(--surf);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.row>div{flex:1;min-width:180px}
.btn{background:var(--pri);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--surf);color:var(--pri);border:1px solid var(--pri)}
.btn:disabled{opacity:.5}
.bolsa{border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;gap:14px;align-items:center;margin-bottom:11px;background:var(--surf)}
.qr{width:96px;height:96px;flex:none;background:#fff;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;padding:5px}
.qr canvas,.qr img{width:100%!important;height:100%!important}
.bi{flex:1;min-width:0}
.bnum{font-weight:700;font-size:16px;color:var(--pri2)}
.brot{font-size:14px;font-weight:500}
.bmeta{font-size:12px;color:var(--ink3);margin-top:3px;word-break:break-all}
.bmeta a{color:var(--pri)}
.mut{color:var(--ink3);font-size:13px}
.tag{display:inline-block;font-size:11px;background:#eef;color:var(--pri2);border-radius:10px;padding:2px 8px;margin-left:6px}
@media print{ body *{visibility:hidden} .print,.print *{visibility:visible} .print{position:absolute;left:0;top:0;width:100%} .noprint{display:none} .bolsa{page-break-inside:avoid} }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head><body>
<div class="wrap">
  <h1>Bolsas do almoxarifado móvel</h1>
  <p class="sub">Crie as bolsas por <b>grupo → subgrupo</b>, imprima os QR e cole em cada bolsa. O QR abre a contagem já naquela bolsa.</p>

  <div class="card noprint">
    <h2>Almoxarifado móvel</h2>
    <div class="row"><div><label>Nome do almoxarifado móvel (o veículo pode mudar)</label><input id="estoque" value="Almox. Móvel · Frente 1"></div>
      <div style="flex:none;display:flex;align-items:flex-end"><button class="btn sec" onclick="carregar()">Carregar</button></div></div>
  </div>

  <div class="card noprint">
    <h2>Nova bolsa</h2>
    <div class="row">
      <div><label>Grupo</label><select id="grupo" onchange="fillSub()"></select></div>
      <div><label>Subgrupo</label><select id="subgrupo"></select></div>
    </div>
    <button class="btn" id="criar" onclick="criar()">+ Criar bolsa</button>
    <span id="msg" class="mut" style="margin-left:10px"></span>
  </div>

  <div class="noprint" style="display:flex;justify-content:space-between;align-items:center;margin:6px 2px 10px">
    <h2 style="margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)">Bolsas <span id="bc"></span></h2>
    <button class="btn sec" onclick="window.print()">🖨 Imprimir etiquetas</button>
  </div>
  <div class="print" id="lista"><p class="mut">Carregando…</p></div>
</div>
<script>
var FN='https://djguxdgaobtminatxkdr.supabase.co/functions/v1/entrada-campo';
var TOKEN='ex-campo-2026';
var GRUPOS=[], BOLSAS=[];
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function estNome(){ return document.getElementById('estoque').value.trim(); }
function fieldURL(qr){ var b=location.href.replace(/eX_Bolsas\.html.*$/,''); return b+'eX_EntradaCampo.html?b='+qr+'&t='+TOKEN; }

function carregar(){
  document.getElementById('lista').innerHTML='<p class="mut">Carregando…</p>';
  fetch(FN+'?action=estrutura&estoque='+encodeURIComponent(estNome()),{headers:{'x-token':TOKEN}})
   .then(function(r){return r.json();}).then(function(d){
     if(d.error) throw new Error(d.error);
     GRUPOS=d.grupos||[]; BOLSAS=d.bolsas||[];
     var gs=document.getElementById('grupo'); gs.innerHTML=GRUPOS.map(function(g){return '<option value="'+g.id+'">'+esc(g.nome)+'</option>';}).join(''); fillSub();
     renderBolsas();
   }).catch(function(e){ document.getElementById('lista').innerHTML='<p class="mut">Erro: '+esc(e.message)+'</p>'; });
}
function fillSub(){
  var g=GRUPOS.find(function(x){return x.id===document.getElementById('grupo').value;});
  var ss=document.getElementById('subgrupo');
  var subs=(g&&g.subgrupos)||[];
  ss.innerHTML=(subs.length?subs.map(function(s){return '<option value="'+esc(s)+'">'+esc(s)+'</option>';}).join(''):'<option value="">(grupo inteiro)</option>');
}
function criar(){
  var gid=document.getElementById('grupo').value; var sub=document.getElementById('subgrupo').value;
  if(!gid){ alert('Escolha o grupo.'); return; }
  var btn=document.getElementById('criar'); btn.disabled=true; document.getElementById('msg').textContent='criando…';
  fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','x-token':TOKEN},body:JSON.stringify({action:'criar_bolsa',estoque:estNome(),grupo_material_id:gid,subgrupo:sub||null})})
   .then(function(r){return r.json();}).then(function(d){
     btn.disabled=false; if(d.error){ document.getElementById('msg').textContent=''; alert(d.error); return; }
     document.getElementById('msg').textContent='criada: '+d.bolsa.numero; carregar();
   }).catch(function(e){ btn.disabled=false; alert('Erro: '+e.message); });
}
function renderBolsas(){
  document.getElementById('bc').textContent='· '+BOLSAS.length;
  var box=document.getElementById('lista');
  if(!BOLSAS.length){ box.innerHTML='<p class="mut">Nenhuma bolsa ainda. Crie a primeira acima.</p>'; return; }
  box.innerHTML=BOLSAS.map(function(b){
    var rot=esc(b.grupo||'')+(b.subgrupo?(' / '+esc(b.subgrupo)):'');
    return '<div class="bolsa"><div class="qr" id="qr_'+b.qr+'"></div>'+
      '<div class="bi"><div class="bnum">'+esc(b.numero)+'</div><div class="brot">'+rot+'</div>'+
      '<div class="bmeta">'+ (b.itens_com_saldo?('<span class="tag">'+b.itens_com_saldo+' com saldo</span>'):'') +
      '<div class="noprint"><a href="'+fieldURL(b.qr)+'" target="_blank">abrir contagem</a></div></div></div></div>';
  }).join('');
  BOLSAS.forEach(function(b){ var el=document.getElementById('qr_'+b.qr); if(el){ el.innerHTML=''; new QRCode(el,{text:fieldURL(b.qr),width:88,height:88,correctLevel:QRCode.CorrectLevel.M}); } });
}
carregar();
</script>
</body></html>
