<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>eX Comercial (CRM)</title>
<meta name="theme-color" content="#533ab7">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" rel="stylesheet">
<style>
:root{
  --bg:#faf9f5;--surf:#fff;--surf2:#f1efe8;--line:rgba(0,0,0,.12);--line2:rgba(0,0,0,.22);
  --tx:#1a1a18;--tx2:#5f5e5a;--tx3:#888780;--pri:#533ab7;--pri-bg:#eeedfe;
  --blue:#185fa5;--green:#3b6d11;--amber:#ba7517;--red:#a32d2d;--teal:#0f6e56;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45}
.material-symbols-rounded{font-family:'Material Symbols Rounded';line-height:1;vertical-align:middle;font-size:20px}
.app{max-width:1320px;margin:0 auto;padding:16px 18px 60px}
.appbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--pri)}.logo b{color:var(--tx)}
.modtag{font-size:12px;font-weight:600;color:var(--tx2);background:var(--surf2);padding:4px 11px;border-radius:20px;display:inline-flex;align-items:center;gap:5px}
.modtag .material-symbols-rounded{font-size:16px;color:var(--pri)}
.spacer{flex:1}
.btn{font-size:13px;padding:8px 13px;border-radius:8px;border:1px solid var(--line2);background:var(--surf);color:var(--tx2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surf2)}
.btn .material-symbols-rounded{font-size:18px}
.btn-p{background:var(--pri);color:#fff;border-color:var(--pri)}.btn-p:hover{background:#472f9e}
.btn-s{font-size:12px;padding:5px 10px}
.tabs{display:inline-flex;background:var(--surf2);border-radius:9px;padding:3px;margin:6px 0 14px}
.tabs button{font-size:13px;font-weight:600;border:none;background:none;color:var(--tx2);cursor:pointer;padding:7px 15px;border-radius:7px;display:inline-flex;align-items:center;gap:6px}
.tabs button.on{background:var(--surf);color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tabs .material-symbols-rounded{font-size:17px}
.search{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;background:var(--surf);min-width:170px}
.search input{border:none;outline:none;background:none;font-size:13px;color:var(--tx);width:100%}
.search .material-symbols-rounded{font-size:18px;color:var(--tx3)}
.view{display:none}.view.on{display:block}

/* ===== KANBAN ===== */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kcol{flex:0 0 250px;background:var(--surf2);border-radius:12px;padding:8px;display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
.kcol.dragover{outline:2px dashed var(--pri);outline-offset:-2px}
.kcol.fim{background:#eaf2e3}
.kcol.fim .kcol-nm{color:var(--green)}
select.fi{appearance:auto;cursor:pointer}
.kcol-h{display:flex;align-items:center;gap:6px;padding:4px 6px 8px}
.kcol-nm{font-size:12.5px;font-weight:700;cursor:text;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcol-nm:hover{color:var(--pri)}
.kcol-ct{font-size:11px;font-weight:700;color:var(--tx2);background:var(--surf);border-radius:10px;padding:1px 8px}
.kcol-acts{display:flex;gap:1px;opacity:.35}.kcol-h:hover .kcol-acts{opacity:1}
.ib{width:22px;height:22px;border:none;border-radius:5px;background:none;color:var(--tx3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.ib:hover{background:var(--surf);color:var(--pri)}.ib:disabled{opacity:.25;cursor:default}
.ib.del:hover{background:#fcebeb;color:var(--red)}.ib .material-symbols-rounded{font-size:15px}
.kcol-body{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.kcard{background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:10px 11px;cursor:pointer;transition:.1s;position:relative}
.cardmenu-btn{position:absolute;top:7px;right:7px;width:26px;height:26px;border:none;background:transparent;border-radius:7px;color:var(--tx3);cursor:pointer;display:grid;place-items:center;z-index:3}
.cardmenu-btn:hover{background:rgba(0,0,0,.07);color:var(--tx)}
.cardmenu-btn .material-symbols-rounded{font-size:19px}
.cardmenu{position:absolute;top:33px;right:7px;background:var(--surf,#fff);border:1px solid var(--line,#e5e5e5);border-radius:10px;box-shadow:0 12px 32px rgba(20,10,50,.20);padding:5px;display:none;flex-direction:column;gap:2px;z-index:30;min-width:180px}
.cardmenu.open{display:flex}
.cardmenu button{display:flex;align-items:center;gap:9px;border:none;background:transparent;padding:9px 10px;border-radius:7px;font:600 12.5px inherit;color:var(--tx);cursor:pointer;text-align:left;white-space:nowrap}
.cardmenu button:hover{background:var(--pri-bg,#f0ecfb)}
.cardmenu button.danger{color:var(--danger,#c0392b)}
.cardmenu button.danger:hover{background:#fdecea}
.cardmenu .material-symbols-rounded{font-size:17px}
.detailmodal{position:fixed;inset:0;z-index:500;background:rgba(20,14,40,.55);display:none;overflow:auto;padding:20px}
.detailmodal.show{display:block}
.detailmodal-card{position:relative;background:var(--bg,#f5f5fb);width:min(1040px,95vw);margin:20px auto;border-radius:14px;box-shadow:0 30px 90px rgba(20,10,50,.42)}
.detailmodal-bar{display:flex;justify-content:flex-end;padding:9px 10px 0}
.detailmodal-x{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surf,#fff);color:var(--tx);border-radius:9px;padding:7px 12px;font:700 12.5px inherit;cursor:pointer}
.detailmodal-x:hover{border-color:var(--pri);color:var(--pri)}
.detailmodal-x .material-symbols-rounded{font-size:17px}
.kcard:hover{border-color:var(--line2);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.kcard.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-bg)}
.kcard-nm{font-size:12.5px;font-weight:700;line-height:1.3}
.kcard-cli{font-size:11px;color:var(--tx3);margin-top:3px;display:flex;align-items:center;gap:4px}
.kcard-cli .material-symbols-rounded{font-size:12px}
.kcard-foot{display:flex;align-items:center;gap:6px;margin-top:8px}
.temp{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:10px}
.temp.frio{background:#e7f0fa;color:var(--blue)}.temp.morno{background:#faeeda;color:var(--amber)}.temp.quente{background:#fcebeb;color:var(--red)}
.orcb{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:8px;display:inline-flex;align-items:center;gap:4px;margin-top:6px;text-transform:capitalize}
.orcb .material-symbols-rounded{font-size:13px}
/* card de LOTE (agrupado) */
.kcard.lote{border:1.5px solid var(--pri);background:var(--pri-bg,#efeafc)}
.lote-tag{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--pri);border-radius:20px;padding:2px 8px;margin-bottom:6px}
.lote-tag .material-symbols-rounded{font-size:11px;color:#fff}
.orcb.loteb{color:var(--pri-d,#3f2c8f);background:#fff;border:1px solid var(--line)}
.lexpand{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--pri);margin-top:6px;cursor:pointer}
.lexpand .material-symbols-rounded{font-size:14px;color:var(--pri)}
.lote-units{display:none;margin-top:7px;border-top:1px dashed var(--line);padding-top:6px}
.kcard.lote.open .lote-units{display:block}
.lote-units .lu{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx);padding:3px 0;text-decoration:none}
.lote-units a.lu:hover{color:var(--pri)}
.lote-units .lu .material-symbols-rounded{font-size:12px;color:var(--pri)}
.lote-units .lu.more{color:var(--tx3);font-style:italic}
.lopen{margin-top:6px;width:100%;border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:7px;padding:6px;font:700 11px inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.lopen .material-symbols-rounded{font-size:13px;color:#fff}
.orcb.rascunho{color:var(--tx2);background:var(--surf2)}
.orcb.enviado{color:var(--blue);background:#e7f0fa}
.orcb.aprovado{color:var(--green);background:#e9f2dd}
.kmove{margin-left:auto;display:flex;gap:1px}
.kmove button{width:22px;height:22px;border:1px solid var(--line);border-radius:6px;background:var(--surf);color:var(--tx3);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.kmove button:hover:not(:disabled){background:var(--pri-bg);border-color:var(--pri);color:var(--pri)}
.kmove button:disabled{opacity:.3;cursor:default}
.kadd{font-size:12px;color:var(--tx3);background:none;border:1px dashed var(--line2);border-radius:8px;padding:6px;cursor:pointer}
.kadd:hover{color:var(--pri);border-color:var(--pri);background:var(--surf)}
.newcol{flex:0 0 140px;border:1px dashed var(--line2);border-radius:12px;background:none;color:var(--tx3);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;gap:5px;min-height:50px}
.newcol:hover{color:var(--pri);border-color:var(--pri)}.newcol .material-symbols-rounded{font-size:17px}

/* ===== DETALHE ===== */
.detail{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:16px}
.dhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.davatar{width:44px;height:44px;border-radius:11px;background:var(--pri-bg);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0}
.dhead .dt{flex:1;min-width:0}.dhead .dt h2{font-size:17px;font-weight:700}
.dhead .dt .sub{font-size:12px;color:var(--tx2);margin-top:2px}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}
.mini{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--pri-bg);color:var(--pri)}
.dinfo{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 18px;margin-top:14px}
@media(max-width:560px){.dinfo{grid-template-columns:1fr}}
.di{display:flex;flex-direction:column;gap:2px}
.di .l{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);font-weight:600}
.di .v{font-size:13px}.di .v.empty{color:var(--tx3);font-style:italic}
.dobs{font-size:12px;color:var(--tx2);margin-top:12px;padding:10px 12px;background:var(--surf2);border-radius:8px}
.sec2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sec2 .material-symbols-rounded{font-size:16px;color:var(--pri)}
.subcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.subc{border:1px solid var(--line);border-radius:9px;padding:10px 12px;position:relative}
.subc .nm{font-size:13px;font-weight:600}.subc .mt{font-size:11px;color:var(--tx3);margin-top:2px}
.subc .acts{position:absolute;top:8px;right:8px;display:flex;gap:2px;opacity:0}.subc:hover .acts{opacity:1}
.iconb{width:24px;height:24px;border:1px solid var(--line);border-radius:6px;background:var(--surf);color:var(--tx3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.iconb:hover{background:var(--pri-bg);border-color:var(--pri);color:var(--pri)}
.iconb.del:hover{background:#fcebeb;border-color:var(--red);color:var(--red)}.iconb .material-symbols-rounded{font-size:15px}
.empty{padding:22px;text-align:center;color:var(--tx3);font-size:13px}

/* clientes bank */
.cgrid{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
@media(max-width:820px){.cgrid{grid-template-columns:1fr}}
.col-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.col-h .material-symbols-rounded{font-size:15px;color:var(--pri)}
.ccard{background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;margin-bottom:8px}
.ccard:hover{border-color:var(--line2)}.ccard.sel{border-color:var(--pri);background:var(--pri-bg)}
.ccard .nm{font-size:14px;font-weight:700}.ccard .mt{font-size:11px;color:var(--tx3);margin-top:2px}
.ccard .cnt{font-size:11px;color:var(--pri);font-weight:600;margin-top:5px;display:inline-flex;align-items:center;gap:4px}
.ccard .cnt .material-symbols-rounded{font-size:14px}
.seg{display:inline-flex;background:var(--pri-bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{display:inline-flex;align-items:center;gap:6px;border:none;background:transparent;padding:7px 13px;border-radius:8px;font:inherit;font-size:13px;font-weight:600;color:var(--tx2);cursor:pointer}
.seg button.on{background:var(--surf);color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.09)}
.seg button .material-symbols-rounded{font-size:17px}
.lojas-found{background:var(--pri-bg);border:1px solid #d9d3f7;border-radius:11px;padding:6px;margin-bottom:12px}
.lojas-found .lf-h{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);padding:6px 8px 4px;display:flex;align-items:center;gap:5px}
.lojas-found .lf-h .material-symbols-rounded{font-size:15px}
.lf-item{background:var(--surf);border-radius:8px;padding:8px 10px;cursor:pointer;margin:4px}
.lf-item:hover{background:#faf9ff;box-shadow:0 0 0 1px var(--pri) inset}
.lf-item .nm{font-size:13px;font-weight:600}.lf-item .mt{font-size:11px;color:var(--tx3);margin-top:1px}
.lf-item .mt b{color:var(--tx2);font-weight:600}
.selbtn{text-align:left;cursor:pointer;position:relative;padding-right:26px;background:var(--surf)}
.selbtn::after{content:'';position:absolute;right:12px;top:50%;transform:translateY(-25%);border:5px solid transparent;border-top-color:var(--tx3)}
.selbtn.placeholder{color:var(--tx3)}
.selbtn:hover{border-color:var(--tx3)}
#opList .pk,#opNew .pk{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--surf);cursor:pointer;padding:9px 12px;margin-bottom:6px}
#opList .pk:hover,#opNew .pk:hover{background:var(--pri-bg);border-color:var(--pri)}
#opList .pk .nm{font-size:13px;font-weight:600}#opList .pk .mt{font-size:11px;color:var(--tx3)}
#opNew .pk.new,#opList .pk.new{border-style:dashed;color:var(--pri);font-weight:600;flex-direction:row;align-items:center;gap:6px;margin-bottom:0;justify-content:center}
#opList .empty{padding:14px;text-align:center;color:var(--tx3);font-size:12px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
.modal-bg.show{display:flex}
.modal{background:var(--surf);border-radius:13px;width:540px;max-width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.mh b{font-size:15px;font-weight:700}.mh .x{cursor:pointer;color:var(--tx3);background:none;border:none;display:flex}
.mb{padding:16px 18px;overflow-y:auto}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.fg{margin-bottom:12px}.fl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);margin-bottom:5px;display:block}
.fi{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:7px;background:var(--surf);font-size:13px;color:var(--tx);font-family:inherit}
.fi:focus{outline:none;border-color:var(--pri)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:6px 11px;border-radius:17px;border:1px solid var(--line2);background:var(--surf);color:var(--tx2);cursor:pointer}
.chip:hover{border-color:var(--pri)}.chip.sel{background:var(--pri-bg);border-color:var(--pri);color:var(--pri);font-weight:600}
.chip.dim{opacity:.4}
.chip.ts{display:inline-flex;align-items:center;gap:5px}
.chip.ts .material-symbols-rounded{font-size:15px}
.chip.soon{opacity:.55;cursor:default}
/* config de fase (papel + gate) */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipsel{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:6px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--surf);color:var(--tx2);cursor:pointer;font:inherit;font-size:12px}
.chipsel:hover{border-color:var(--pri)}
.chipsel.on{background:var(--pri-bg);border-color:var(--pri);color:var(--pri);font-weight:700}
.chipsel .material-symbols-rounded{font-size:16px}
.fz-req{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;color:var(--tx2);background:var(--pri-bg);border:1px dashed var(--pri);border-radius:8px;padding:7px 9px}
.fz-req .material-symbols-rounded{font-size:15px;color:var(--pri)}
.kcol-papel{display:flex;align-items:center;gap:4px;padding:0 6px 8px;font-size:10.5px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.02em}
.kcol-papel .material-symbols-rounded{font-size:13px;color:var(--pri)}
.kgate{display:inline-flex;align-items:center;gap:2px;margin-left:auto;padding:1px 6px;border-radius:8px;text-transform:none;letter-spacing:0}
.kgate .material-symbols-rounded{font-size:12px}
.kgate.suave{background:#fff5e6;color:#b26a00}.kgate.rigida{background:#fcebeb;color:var(--red)}
/* chave Master (acesso admin, provisório) */
.mchave{display:inline-flex;align-items:center;gap:7px;background:var(--surf);border:1px solid var(--line2);border-radius:11px;padding:5px 10px;cursor:pointer;user-select:none}
.mchave .led{width:8px;height:8px;border-radius:50%;background:var(--tx3)}
.mchave .led.on{background:var(--green,#1d9e75);box-shadow:0 0 6px var(--green,#1d9e75)}
.mchave .msw{position:relative;width:38px;height:21px;border-radius:12px;background:var(--line2);transition:.16s;flex:0 0 auto}
.mchave .msw.on{background:var(--pri)}
.mchave .msw i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.mchave .msw.on i{left:19px}
.mchave .mlb{font-size:12px;font-weight:700;color:var(--tx2)}
/* seções no detalhe da opp */
.dsec{margin-top:15px;border-top:1px solid var(--line);padding-top:12px}
.dsec-t{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);font-weight:800;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.dsec-t .material-symbols-rounded{font-size:16px;color:var(--pri)}
.ffld{margin-bottom:10px}
.ffld .fl{display:block;font-size:11.5px;font-weight:700;color:var(--tx2);margin-bottom:4px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font-size:12px;padding:6px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--surf);color:var(--tx2);cursor:pointer;font:inherit;font-size:12px}
.opt.on{background:var(--pri-bg);border-color:var(--pri);color:var(--pri);font-weight:700}
.opt.yes.on{background:#e7f6ef;border-color:var(--green,#1d9e75);color:var(--green,#1d9e75)}
/* menu mover card */
.dmv{display:flex;flex-direction:column;gap:6px}
.dmvbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line2);background:var(--surf);border-radius:10px;padding:9px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--tx)}
.dmvbtn:hover:not(:disabled){border-color:var(--pri);background:var(--pri-bg)}
.dmvbtn .ar{color:var(--pri);font-size:17px}
.dmvbtn.back{color:var(--tx2)}.dmvbtn.back .ar{color:var(--tx3)}
.dmvbtn:disabled{opacity:.5;cursor:not-allowed}

// menu "mover card para fase" (por dentro do card) — a CHAVE (liga/desliga destino, só admin) fica NA FRENTE de cada botão de mover
function oppMoverHTML(o){
  const fid=o.colId, ci=colIdx(fid), gate=colGate(fid), falta=faltaParaSair(o,fid);
  const k=S.colunas.find(x=>x.id===fid), perm=(k&&k.destinos!=null)?k.destinos:null;
  const allowed=id=>(perm==null)||perm.includes(id);
  const lista=S.colunas.filter(x=>x.id!==fid && allowed(x.id));   // MOVER = só os destinos LIBERADOS (usar); configurar é separado (só master)
  const cfgLink=MASTER?`<button class="dmv-cfg" onclick="openConfigMover('${fid}')"><span class="material-symbols-rounded">tune</span>Configurar mover cards</button>`:'';
  if(!lista.length) return `<div class="dsec"><div class="dsec-t"><span class="material-symbols-rounded">alt_route</span>Mover card para fase</div><div class="dmv-empty">${MASTER?'Nenhum destino liberado — configure abaixo.':'Sem destino liberado a partir desta fase.'}</div>${cfgLink}</div>`;
  const rows=lista.map(x=>{ const fwd=colIdx(x.id)>ci; let tag='',dis='';
    if(falta.length && fwd){ if(gate==='rigida'){ tag=`<span class="dmv-blk"><span class="material-symbols-rounded">lock</span>trava rígida</span>`; dis='disabled'; } else if(gate==='suave'){ tag=`<span class="dmv-warn"><span class="material-symbols-rounded">warning</span>avisa</span>`; } }
    return `<div class="dmvrow"><button class="dmvbtn ${fwd?'':'back'}" ${dis} onclick="moverOppPara('${o.id}','${x.id}')"><span class="material-symbols-rounded ar">${fwd?'east':'west'}</span>${esc(x.nome)}${tag}</button></div>`;
  }).join('');
  const hint=(falta.length&&gate!=='nenhuma')?`<div class="dmv-hint"><span class="material-symbols-rounded">info</span>Falta: <b>${esc(falta.join(', '))}</b>. ${gate==='rigida'?'A trava rígida bloqueia o avanço.':'A trava suave avisa mas deixa avançar.'}</div>`:'';
  return `<div class="dsec"><div class="dsec-t"><span class="material-symbols-rounded">alt_route</span>Mover card para fase</div><div class="dmv">${rows}</div>${hint}${cfgLink}</div>`;
}
// liga/desliga um destino a partir da fase (só quem tem acesso) — direto na tela do card
function togDestFase(fromId,destId){ if(!MASTER){ alert('Sem acesso: ligar/desligar destinos é do administrador.'); return; }
  const k=S.colunas.find(x=>x.id===fromId); if(!k)return;
  if(k.destinos==null) k.destinos=S.colunas.filter(x=>x.id!==fromId).map(x=>x.id);
  const i=k.destinos.indexOf(destId); if(i<0)k.destinos.push(destId); else k.destinos.splice(i,1);
  const outras=S.colunas.filter(x=>x.id!==fromId).map(x=>x.id);
  if(k.destinos.length===outras.length) k.destinos=null;   // todas marcadas = sem restrição
  save(); cFases(); render(); }
/* ===== Configurar mover cards (modal — só master/administrador master) ===== */
let CFG_MOVER=null;
function openConfigMover(fid){
  if(!MASTER){ alert('Sem acesso: configurar os destinos é do administrador master.'); return; }
  const k=S.colunas.find(x=>x.id===fid); if(!k)return;
  const outras=S.colunas.filter(x=>x.id!==fid).map(x=>x.id);
  const atual=(k.destinos==null)?outras.slice():k.destinos.slice();
  CFG_MOVER={fid, sel:new Set(atual)}; renderConfigMover();
}
function renderConfigMover(){
  if(!CFG_MOVER)return; const fid=CFG_MOVER.fid; const fnome=colNome(fid);
  const rows=S.colunas.map(x=>{
    if(x.id===fid) return `<div class="cfgm-row"><span class="cfgm-nm">${esc(x.nome)}</span><span class="cfgm-atual">Fase atual</span></div>`;
    const on=CFG_MOVER.sel.has(x.id);
    return `<div class="cfgm-row"><span class="cfgm-nm">${esc(x.nome)}</span><span class="tg ${on?'on':''}" onclick="cfgMoverTog('${x.id}')"><i></i></span></div>`;
  }).join('');
  let ov=document.getElementById('cfgMoverModal');
  if(!ov){ ov=document.createElement('div'); ov.id='cfgMoverModal'; ov.className='modal-bg'; ov.onclick=e=>{ if(e.target===ov)closeConfigMover(); }; document.body.appendChild(ov); }
  ov.innerHTML=`<div class="modal cfgm">
    <div class="cfgm-head"><h3>Configurar mover cards</h3><button class="cfgm-x" onclick="closeConfigMover()"><span class="material-symbols-rounded">close</span></button></div>
    <div class="cfgm-sub">Escolha para quais fases os cards podem ser movidos a partir de <b>${esc(fnome)}</b>.</div>
    <div class="cfgm-list">${rows}</div>
    <div class="cfgm-foot"><button class="btn" onclick="closeConfigMover()">Cancelar</button><button class="btn btn-p" onclick="salvarConfigMover()">Salvar</button></div>
  </div>`;
  ov.classList.add('show');
}
function cfgMoverTog(id){ if(!CFG_MOVER)return; if(CFG_MOVER.sel.has(id))CFG_MOVER.sel.delete(id); else CFG_MOVER.sel.add(id); renderConfigMover(); }
function closeConfigMover(){ const ov=document.getElementById('cfgMoverModal'); if(ov)ov.classList.remove('show'); CFG_MOVER=null; }
function salvarConfigMover(){ if(!CFG_MOVER)return; const k=S.colunas.find(x=>x.id===CFG_MOVER.fid);
  if(k){ const outras=S.colunas.filter(x=>x.id!==CFG_MOVER.fid).map(x=>x.id); const sel=outras.filter(id=>CFG_MOVER.sel.has(id));
    k.destinos=(sel.length===outras.length)?null:sel; save(); cFases(); }
  closeConfigMover(); render(); }

function gerarOrcamento(id){
  const o=S.oportunidades.find(x=>x.id===id); if(!o)return;
  if(!orcIndex()[id]){   // 1ª vez: manda o pré-preenchimento
    const ct=cli(o.contratanteId), cp=contempl(o.contempladoId);
    const prefill={ oppId:o.id, cliNome:ct?ct.nome:'', cliContato:ct?(ct.contato||''):'', cliFone:ct?(ct.fone||''):'', cliEmail:ct?(ct.email||''):'',
      finNome:cp?cp.nome:'', finEnd:cp?(cp.endereco||''):'', solTitulo:o.objeto||'', solDesc:o.obs||'' };
    try{ localStorage.setItem('ex_orc_prefill', JSON.stringify(prefill)); }catch(e){}
  }

}
function gerarOrcBarramento(id){
  const o=S.oportunidades.find(x=>x.id===id); if(!o)return;
  const ct=cli(o.contratanteId), cp=contempl(o.contempladoId);
  const prefill={ oppId:o.id, cliNome:ct?ct.nome:'', cliContato:ct?(ct.contato||''):'', cliFone:ct?(ct.fone||''):'', cliEmail:ct?(ct.email||''):'',
    finNome:cp?cp.nome:'', solTitulo:o.objeto||'', solDesc:o.obs||'' };

function gerarObra(id){
  const o=S.oportunidades.find(x=>x.id===id); if(!o)return;
  let orc=null; try{ orc=JSON.parse(localStorage.getItem('ex_orc_v6__'+id)||'null'); }catch(e){}
  if(!orc){ alert('Gere o orçamento desta oportunidade primeiro.'); return; }
  const ct=cli(o.contratanteId), cp=contempl(o.contempladoId);
  // congela o ORÇADO por serviço (baseline Decisão 2): custo, preço (c/ margem) e horas da composição
  const _n=v=>{ if(v==null||v==='')return 0; if(typeof v==='number')return v; let s=(''+v).replace(/[R$\s]/g,''); if(s.indexOf(',')>-1)s=s.replace(/\./g,'').replace(',','.'); return parseFloat(s)||0; };
  const mB=_n(orc.margemBase);
  const _cu=s=>_n(s.usarBase===false?s.custoAlt:s.custoBase);
  const _mg=s=>(s.margem===''||s.margem==null)?mB:_n(s.margem);
  const servicos=(orc.servicos||[]).filter(s=>s&&s.desc).map(s=>{
    const q=_n(s.qtd)||1, cu=_cu(s), tUnit=_n(s.compTempo);
    return { nome:s.desc, qtd:q, orc:{ custo:+(q*cu).toFixed(2), preco:+(q*cu*(1+_mg(s)/100)).toFixed(2), horas:+(q*tUnit).toFixed(2), tempoUnit:+tUnit.toFixed(2) } };
  });
  if(!servicos.length){ if(!confirm('O orçamento não tem serviços. Criar a obra mesmo assim (vazia)?'))return; }
  const payload={ oppId:o.id, numero:orc.numero||'', nome:o.objeto||titulo(o), contratante:ct?ct.nome:'', contemplado:cp?cp.nome:'', obs:o.obs||'', servicos };
  try{ localStorage.setItem('ex_obra_pending', JSON.stringify(payload)); }catch(e){}
  window.open('index.html','_blank');
}

  document.getElementById('clist').innerHTML= html || '<div class="empty">Nada encontrado.</div>';
}
function selCli(id){ SELC=id; render(); }
function selLoja(lojaId){ const ct=contratantesDaLoja(lojaId)[0]; if(ct){ SELC=ct.id; } render(); }
function renderCdetail(){
  const el=document.getElementById('cdetail');
  const c=SELC&&S.clientes.find(x=>x.id===SELC);
  if(!c){ el.innerHTML='<div class="empty">Selecione um contratante.</div>'; if(SELC)SELC=null; return; }
  const vincs=vincsDoContratante(c.id);
  const di=(l,v)=>`<div class="di"><span class="l">${l}</span><span class="v ${v?'':'empty'}">${v?esc(v):'—'}</span></div>`;
  el.innerHTML=`<div class="detail" style="margin-top:0">
    <div class="dhead">
      <div class="davatar">${ini(c.nome)}</div>
      <div class="dt"><h2>${esc(c.nome)}</h2><div class="sub">Contratante</div></div>
      <button class="btn btn-s" onclick="openCli('contratante','${c.id}')"><span class="material-symbols-rounded">edit</span>Editar</button>
    </div>
    <div class="dinfo">${di('CNPJ',c.cnpj)} ${di('Contato',c.contato)} ${di('Fone',c.fone)} ${di('E-mail',c.email)} ${di('Endereço',c.endereco)}</div>
    ${c.obs?`<div class="dobs">${esc(c.obs)}</div>`:''}
    <div class="sec2"><span class="material-symbols-rounded">storefront</span>Lojas vinculadas (${vincs.length})<span class="spacer"></span>
      <button class="btn btn-s" onclick="abrirVincular()"><span class="material-symbols-rounded">link</span>Vincular loja</button>
      <button class="btn btn-s btn-p" onclick="openLoja(null,true)"><span class="material-symbols-rounded">add</span>Nova loja</button></div>
    ${vincs.length?`<div class="subcards">${vincs.map(v=>{const l=loja(v.lojaId); if(!l)return ''; const outros=contratantesDaLoja(l.id).filter(x=>x.id!==c.id);
      return `<div class="subc"><div class="acts">
        <button class="iconb" title="Editar loja" onclick="openLoja('${l.id}')"><span class="material-symbols-rounded">edit</span></button>
        <button class="iconb del" title="Desvincular deste contratante" onclick="desvincular('${v.id}')"><span class="material-symbols-rounded">link_off</span></button></div>
        <div class="nm">${esc(l.nome)}${l.numero?` <span style="font-weight:600;color:var(--pri)">#${esc(l.numero)}</span>`:''}</div>
        <div class="mt">${esc(ljSub(l))}</div>
        ${v.papel?`<div class="mt" style="color:var(--pri)">Serviço: ${esc(v.papel)}</div>`:''}
        ${outros.length?`<div class="mt" style="font-size:11px">Também de: ${esc(outros.map(o=>o.nome).join(', '))}</div>`:''}
      </div>`;}).join('')}</div>`:'<div class="empty" style="padding:14px">Nenhuma loja vinculada. Use "Nova loja" (cria no banco e vincula) ou "Vincular loja" (reaproveita do banco).</div>'}
  </div>`;
}
function openCli(tipo,id){
  EDITC={tipo, id:id||null};
  const c=id?S.clientes.find(x=>x.id===id):null;
  document.getElementById('cTitle').textContent=(id?'Editar ':'Novo ')+(tipo==='contratante'?'contratante':'contemplado / loja');
  ['nome','cnpj','contato','fone','email','endereco','obs'].forEach(f=>document.getElementById('c_'+f).value=c?(c[f]||''):'');
  document.getElementById('cDel').style.display=id?'inline-flex':'none';
  document.getElementById('modalCli').classList.add('show');
}
function closeCli(){ document.getElementById('modalCli').classList.remove('show'); EDITC=null; _fromPipe=null; }
function saveCli(){
  const fp=_fromPipe;
  const g=f=>document.getElementById('c_'+f).value.trim();
  const nome=g('nome'); if(!nome){ alert('Informe o nome.'); return; }
  const data={nome,cnpj:g('cnpj'),contato:g('contato'),fone:g('fone'),email:g('email'),endereco:g('endereco'),obs:g('obs')};
  let alvo;
  if(EDITC.id){ alvo=S.clientes.find(x=>x.id===EDITC.id); Object.assign(alvo, data); }
  else if(EDITC.tipo==='contratante'){ alvo={id:uid(),tipo:'contratante',paiId:null,...data}; S.clientes.push(alvo); if(fp){_oc=alvo.id;_op=null;}else{SELC=alvo.id;} }
  else{ const parent=fp?_oc:SELC; alvo={id:uid(),tipo:'contemplado',paiId:parent,...data}; S.clientes.push(alvo); if(fp)_op=alvo.id; }
  save(); cUp('clientes',mCli(alvo)); closeCli();
  if(fp) renderOppSelects();
  render();
}
function delCliBtn(){ if(EDITC&&EDITC.id) delCliDireto(EDITC.id,true); }
function delCliDireto(id,fromModal){
  const c=S.clientes.find(x=>x.id===id); if(!c)return;
  if(!confirm(`Excluir "${c.nome}"?`+(c.tipo==='contratante'?' (contemplados e oportunidades ligadas também saem)':'')))return;
  const filhosIds=S.clientes.filter(x=>x.paiId===id).map(x=>x.id);
  let oppsRemovidas=[], oppsAtualizadas=[];
  if(c.tipo==='contratante'){ oppsRemovidas=S.oportunidades.filter(o=>o.contratanteId===id).map(o=>o.id); }
  else { oppsAtualizadas=S.oportunidades.filter(o=>o.contempladoId===id); }
  S.clientes=S.clientes.filter(x=>x.id!==id && x.paiId!==id);
  if(c.tipo==='contratante'){ S.oportunidades=S.oportunidades.filter(o=>o.contratanteId!==id); }
  else { S.oportunidades.forEach(o=>{ if(o.contempladoId===id)o.contempladoId=null; }); }
  let vincsRemovidos=[];
  if(c.tipo==='contratante'){ vincsRemovidos=S.vinculos.filter(v=>v.contratanteId===id).map(v=>v.id); S.vinculos=S.vinculos.filter(v=>v.contratanteId!==id); }
  if(SELC===id)SELC=null;
  save();
  cDel('clientes',id); filhosIds.forEach(fid=>cDel('clientes',fid)); vincsRemovidos.forEach(vid=>cDel('vinculos',vid));
  oppsRemovidas.forEach(oid=>cDel('oportunidades',oid));
  oppsAtualizadas.forEach(o=>cUp('oportunidades',mOpp(o)));
  if(fromModal)closeCli(); render();
}

/* ===== LOJAS + VINCULOS (funcoes) ===== */
let EDITL=null, _linkAfterSave=false;
function openLoja(id, linkAfterSave){
  EDITL=id||null; _linkAfterSave=!!linkAfterSave;
  const l=id?loja(id):null;
  document.getElementById('lTitle').textContent=(id?'Editar loja':'Nova loja');
  ['nome','grupo','numero','cnpj','endereco','coordenada','contato','fone','email','obs'].forEach(f=>{const el=document.getElementById('l_'+f); if(el)el.value=l?(l[f]||''):'';});
  document.getElementById('lDel').style.display=id?'inline-flex':'none';
  document.getElementById('modalLoja').classList.add('show');
}
function closeLoja(){ document.getElementById('modalLoja').classList.remove('show'); EDITL=null; _linkAfterSave=false; }
function saveLoja(){
  const g=f=>{const el=document.getElementById('l_'+f); return el?el.value.trim():'';};
  const nome=g('nome'); if(!nome){ alert('Informe o nome da loja.'); return; }
  const data={nome,grupo:g('grupo'),numero:g('numero'),cnpj:g('cnpj'),endereco:g('endereco'),coordenada:g('coordenada'),contato:g('contato'),fone:g('fone'),email:g('email'),obs:g('obs')};
  let alvo;
  if(EDITL){ alvo=loja(EDITL); Object.assign(alvo,data); }
  else { alvo={id:uid(),...data}; S.lojas.push(alvo); }
  cUp('lojas',mLoja(alvo));
  if(!EDITL && _linkAfterSave && SELC){ criarVinculo(SELC, alvo.id, ''); }
  const fromOpp = !EDITL && document.getElementById('modalOpp') && document.getElementById('modalOpp').classList.contains('show');
  if(fromOpp){ _op=alvo.id; }
  save(); closeLoja(); render();
  if(fromOpp) renderOppSelects();
}
function delLojaBtn(){ if(EDITL) delLoja(EDITL,true); }
function delLoja(id,fromModal){
  const l=loja(id); if(!l)return;
  const vs=S.vinculos.filter(v=>v.lojaId===id);
  if(!confirm(`Excluir a loja "${l.nome}"? Ela sai de TODOS os contratantes (${vs.length} vinculo(s)).`))return;
  S.lojas=S.lojas.filter(x=>x.id!==id);
  S.vinculos=S.vinculos.filter(v=>v.lojaId!==id);
  cDel('lojas',id); vs.forEach(v=>cDel('vinculos',v.id));
  save(); if(fromModal)closeLoja(); render();
}
function criarVinculo(ctId, ljId, papel){
  if(S.vinculos.find(v=>v.contratanteId===ctId&&v.lojaId===ljId)) return;
  const v={id:uid(),contratanteId:ctId,lojaId:ljId,papel:papel||'',obs:''};
  S.vinculos.push(v); cUp('vinculos',mVinc(v)); save();
}
function desvincular(vincId){
  const v=S.vinculos.find(x=>x.id===vincId); if(!v)return;
  const l=loja(v.lojaId);
  if(!confirm(`Desvincular "${l?l.nome:'loja'}" deste contratante? (a loja continua no banco)`))return;
  S.vinculos=S.vinculos.filter(x=>x.id!==vincId); cDel('vinculos',vincId); save(); render();
}
function abrirVincular(){ if(!SELC){alert('Selecione um contratante.');return;} document.getElementById('vPapel').value=''; document.getElementById('vBusca').value=''; document.getElementById('modalVinc').classList.add('show'); renderVincList(); }
function closeVinc(){ document.getElementById('modalVinc').classList.remove('show'); }
function renderVincList(){
  const q=(document.getElementById('vBusca').value||'').toLowerCase();
  const jaIds=new Set(vincsDoContratante(SELC).map(v=>v.lojaId));
  const lst=S.lojas.filter(l=>l.nome.toLowerCase().includes(q)||(l.numero||'').toLowerCase().includes(q)||(l.grupo||'').toLowerCase().includes(q)||(l.endereco||'').toLowerCase().includes(q)).sort((a,b)=>a.nome.localeCompare(b.nome));
  document.getElementById('vList').innerHTML= lst.length?lst.map(l=>{const ja=jaIds.has(l.id);
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line)"><div style="flex:1;min-width:0"><div class="nm">${esc(l.nome)}</div><div class="mt">${esc(ljSub(l))}</div></div>
      ${ja?'<span style="font-size:11px;color:var(--tx3)">já vinculada</span>':`<button class="btn btn-s btn-p" onclick="vincularLoja('${l.id}')"><span class="material-symbols-rounded">link</span>Vincular</button>`}</div>`;}).join('')
    :'<div class="empty" style="padding:12px">Nenhuma loja no banco. Crie uma nova.</div>';
}
function vincularLoja(ljId){ const papel=document.getElementById('vPapel').value.trim(); criarVinculo(SELC,ljId,papel); renderVincList(); render(); }

initCRM();
</script>
