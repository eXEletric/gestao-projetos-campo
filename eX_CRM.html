<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>eX Comercial (CRM)</title>
<meta name="theme-color" content="#533ab7">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" rel="stylesheet">
<style>
:root{
  --bg:#faf9f5;--surf:#fff;--surf2:#f1efe8;--line:rgba(0,0,0,.12);--line2:rgba(0,0,0,.22);
  --tx:#1a1a18;--tx2:#5f5e5a;--tx3:#888780;--pri:#533ab7;--pri-bg:#eeedfe;
  --blue:#185fa5;--green:#3b6d11;--amber:#ba7517;--red:#a32d2d;--teal:#0f6e56;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45}
.material-symbols-rounded{font-family:'Material Symbols Rounded';line-height:1;vertical-align:middle;font-size:20px}
.app{max-width:1320px;margin:0 auto;padding:16px 18px 60px}
.appbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--pri)}.logo b{color:var(--tx)}
.modtag{font-size:12px;font-weight:600;color:var(--tx2);background:var(--surf2);padding:4px 11px;border-radius:20px;display:inline-flex;align-items:center;gap:5px}
.modtag .material-symbols-rounded{font-size:16px;color:var(--pri)}
.spacer{flex:1}
.btn{font-size:13px;padding:8px 13px;border-radius:8px;border:1px solid var(--line2);background:var(--surf);color:var(--tx2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surf2)}
.btn .material-symbols-rounded{font-size:18px}
.btn-p{background:var(--pri);color:#fff;border-color:var(--pri)}.btn-p:hover{background:#472f9e}
.btn-s{font-size:12px;padding:5px 10px}
.tabs{display:inline-flex;background:var(--surf2);border-radius:9px;padding:3px;margin:6px 0 14px}
.tabs button{font-size:13px;font-weight:600;border:none;background:none;color:var(--tx2);cursor:pointer;padding:7px 15px;border-radius:7px;display:inline-flex;align-items:center;gap:6px}
.tabs button.on{background:var(--surf);color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tabs .material-symbols-rounded{font-size:17px}
.search{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;background:var(--surf);min-width:170px}
.search input{border:none;outline:none;background:none;font-size:13px;color:var(--tx);width:100%}
.search .material-symbols-rounded{font-size:18px;color:var(--tx3)}
.view{display:none}.view.on{display:block}

/* ===== KANBAN ===== */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kcol{flex:0 0 250px;background:var(--surf2);border-radius:12px;padding:8px;display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
.kcol.dragover{outline:2px dashed var(--pri);outline-offset:-2px}
.kcol.fim{background:#eaf2e3}
.kcol.fim .kcol-nm{color:var(--green)}
select.fi{appearance:auto;cursor:pointer}
.kcol-h{display:flex;align-items:center;gap:6px;padding:4px 6px 8px}
.kcol-nm{font-size:12.5px;font-weight:700;cursor:text;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcol-nm:hover{color:var(--pri)}
.kcol-ct{font-size:11px;font-weight:700;color:var(--tx2);background:var(--surf);border-radius:10px;padding:1px 8px}
.kcol-acts{display:flex;gap:1px;opacity:.35}.kcol-h:hover .kcol-acts{opacity:1}
.ib{width:22px;height:22px;border:none;border-radius:5px;background:none;color:var(--tx3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.ib:hover{background:var(--surf);color:var(--pri)}.ib:disabled{opacity:.25;cursor:default}
.ib.del:hover{background:#fcebeb;color:var(--red)}.ib .material-symbols-rounded{font-size:15px}
.kcol-body{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.kcard{background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:10px 11px;cursor:pointer;transition:.1s}
.kcard:hover{border-color:var(--line2);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.kcard.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-bg)}
.kcard-nm{font-size:12.5px;font-weight:700;line-height:1.3}
.kcard-cli{font-size:11px;color:var(--tx3);margin-top:3px;display:flex;align-items:center;gap:4px}
.kcard-cli .material-symbols-rounded{font-size:12px}
.kcard-foot{display:flex;align-items:center;gap:6px;margin-top:8px}
.temp{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:10px}
.temp.frio{background:#e7f0fa;color:var(--blue)}.temp.morno{background:#faeeda;color:var(--amber)}.temp.quente{background:#fcebeb;color:var(--red)}
.orcb{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:8px;display:inline-flex;align-items:center;gap:4px;margin-top:6px;text-transform:capitalize}
.orcb .material-symbols-rounded{font-size:13px}
.orcb.rascunho{color:var(--tx2);background:var(--surf2)}
.orcb.enviado{color:var(--blue);background:#e7f0fa}
.orcb.aprovado{color:var(--green);background:#e9f2dd}
.kmove{margin-left:auto;display:flex;gap:1px}
.kmove button{width:22px;height:22px;border:1px solid var(--line);border-radius:6px;background:var(--surf);color:var(--tx3);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.kmove button:hover:not(:disabled){background:var(--pri-bg);border-color:var(--pri);color:var(--pri)}
.kmove button:disabled{opacity:.3;cursor:default}
.kadd{font-size:12px;color:var(--tx3);background:none;border:1px dashed var(--line2);border-radius:8px;padding:6px;cursor:pointer}
.kadd:hover{color:var(--pri);border-color:var(--pri);background:var(--surf)}
.newcol{flex:0 0 140px;border:1px dashed var(--line2);border-radius:12px;background:none;color:var(--tx3);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;gap:5px;min-height:50px}
.newcol:hover{color:var(--pri);border-color:var(--pri)}.newcol .material-symbols-rounded{font-size:17px}

/* ===== DETALHE ===== */
.detail{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:16px}
.dhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.davatar{width:44px;height:44px;border-radius:11px;background:var(--pri-bg);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0}
.dhead .dt{flex:1;min-width:0}.dhead .dt h2{font-size:17px;font-weight:700}
.dhead .dt .sub{font-size:12px;color:var(--tx2);margin-top:2px}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}
.mini{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--pri-bg);color:var(--pri)}
.dinfo{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 18px;margin-top:14px}
@media(max-width:560px){.dinfo{grid-template-columns:1fr}}
.di{display:flex;flex-direction:column;gap:2px}
.di .l{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);font-weight:600}
.di .v{font-size:13px}.di .v.empty{color:var(--tx3);font-style:italic}
.dobs{font-size:12px;color:var(--tx2);margin-top:12px;padding:10px 12px;background:var(--surf2);border-radius:8px}
.sec2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sec2 .material-symbols-rounded{font-size:16px;color:var(--pri)}
.subcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.subc{border:1px solid var(--line);border-radius:9px;padding:10px 12px;position:relative}
.subc .nm{font-size:13px;font-weight:600}.subc .mt{font-size:11px;color:var(--tx3);margin-top:2px}
.subc .acts{position:absolute;top:8px;right:8px;display:flex;gap:2px;opacity:0}.subc:hover .acts{opacity:1}
.iconb{width:24px;height:24px;border:1px solid var(--line);border-radius:6px;background:var(--surf);color:var(--tx3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.iconb:hover{background:var(--pri-bg);border-color:var(--pri);color:var(--pri)}
.iconb.del:hover{background:#fcebeb;border-color:var(--red);color:var(--red)}.iconb .material-symbols-rounded{font-size:15px}
.empty{padding:22px;text-align:center;color:var(--tx3);font-size:13px}

/* clientes bank */
.cgrid{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
@media(max-width:820px){.cgrid{grid-template-columns:1fr}}
.col-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.col-h .material-symbols-rounded{font-size:15px;color:var(--pri)}
.ccard{background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;margin-bottom:8px}
.ccard:hover{border-color:var(--line2)}.ccard.sel{border-color:var(--pri);background:var(--pri-bg)}
.ccard .nm{font-size:14px;font-weight:700}.ccard .mt{font-size:11px;color:var(--tx3);margin-top:2px}
.ccard .cnt{font-size:11px;color:var(--pri);font-weight:600;margin-top:5px;display:inline-flex;align-items:center;gap:4px}
.ccard .cnt .material-symbols-rounded{font-size:14px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
.modal-bg.show{display:flex}
.modal{background:var(--surf);border-radius:13px;width:540px;max-width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.mh b{font-size:15px;font-weight:700}.mh .x{cursor:pointer;color:var(--tx3);background:none;border:none;display:flex}
.mb{padding:16px 18px;overflow-y:auto}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.fg{margin-bottom:12px}.fl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);margin-bottom:5px;display:block}
.fi{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:7px;background:var(--surf);font-size:13px;color:var(--tx);font-family:inherit}
.fi:focus{outline:none;border-color:var(--pri)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:6px 11px;border-radius:17px;border:1px solid var(--line2);background:var(--surf);color:var(--tx2);cursor:pointer}
.chip:hover{border-color:var(--pri)}.chip.sel{background:var(--pri-bg);border-color:var(--pri);color:var(--pri);font-weight:600}
.chip.dim{opacity:.4}
</style>
</head>
<body>
<div class="app">
  <div class="appbar">
    <span class="logo"><b>e</b>X</span>
    <span class="modtag"><span class="material-symbols-rounded">sell</span>Comercial (CRM)</span>
    <span id="cloudb" style="font-size:11px;color:var(--tx3)"></span>
    <span class="spacer"></span>
    <div class="search"><span class="material-symbols-rounded">search</span><input id="q" placeholder="Buscar…" oninput="render()"></div>
    <button class="btn" onclick="resetDemo()" title="Recarregar exemplo"><span class="material-symbols-rounded">restart_alt</span></button>
  </div>

  <div class="tabs">
    <button id="tab-funil" class="on" onclick="setTab('funil')"><span class="material-symbols-rounded">view_kanban</span>Funil de oportunidades</button>
    <button id="tab-clientes" onclick="setTab('clientes')"><span class="material-symbols-rounded">contacts</span>Clientes (banco)</button>
  </div>

  <!-- FUNIL -->
  <div class="view on" id="v-funil">
    <div style="margin-bottom:12px"><button class="btn btn-p" onclick="novaOpp()"><span class="material-symbols-rounded">add</span>Nova oportunidade</button></div>
    <div class="board" id="board"></div>
    <div id="oppDetail"></div>
  </div>

  <!-- CLIENTES -->
  <div class="view" id="v-clientes">
    <div style="margin-bottom:12px"><button class="btn btn-p" onclick="openCli('contratante')"><span class="material-symbols-rounded">add</span>Novo contratante</button></div>
    <div class="cgrid">
      <div><div class="col-h"><span class="material-symbols-rounded">business</span>Contratantes</div><div id="clist"></div></div>
      <div><div class="col-h"><span class="material-symbols-rounded">badge</span>Detalhe</div><div id="cdetail"></div></div>
    </div>
  </div>
</div>

<!-- MODAL OPORTUNIDADE -->
<div class="modal-bg" id="modalOpp">
  <div class="modal">
    <div class="mh"><b id="oTitle">Oportunidade</b><button class="x" onclick="closeOpp()"><span class="material-symbols-rounded">close</span></button></div>
    <div class="mb">
      <div class="fg"><label class="fl">Cliente contratante</label><select class="fi" id="o_contratante_sel" onchange="onContratante(this.value)"></select></div>
      <div class="fg"><label class="fl">Cliente contemplado / loja</label><select class="fi" id="o_contemplado_sel" onchange="onContemplado(this.value)"></select></div>
      <div class="fg"><label class="fl">Objeto da demanda</label><input class="fi" id="o_objeto" placeholder="Ex.: Automação de iluminação — 4 QDs"></div>
      <div class="frow">
        <div class="fg"><label class="fl">Temperatura</label><div class="chips" id="o_temp"></div></div>
        <div class="fg"><label class="fl">Data limite p/ orçamento</label><input class="fi" id="o_data" type="date"></div>
      </div>
      <div class="fg"><label class="fl">Observações</label><input class="fi" id="o_obs"></div>
    </div>
    <div class="mf">
      <button class="btn" id="oDel" onclick="delOpp()" style="color:var(--red)"><span class="material-symbols-rounded">delete</span>Excluir</button>
      <span class="spacer"></span>
      <button class="btn btn-p" onclick="saveOpp()"><span class="material-symbols-rounded">check</span>Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL CLIENTE -->
<div class="modal-bg" id="modalCli">
  <div class="modal">
    <div class="mh"><b id="cTitle">Cliente</b><button class="x" onclick="closeCli()"><span class="material-symbols-rounded">close</span></button></div>
    <div class="mb">
      <div class="fg"><label class="fl">Nome / razão social</label><input class="fi" id="c_nome"></div>
      <div class="frow">
        <div class="fg"><label class="fl">CNPJ</label><input class="fi" id="c_cnpj"></div>
        <div class="fg"><label class="fl">Contato</label><input class="fi" id="c_contato"></div>
      </div>
      <div class="frow">
        <div class="fg"><label class="fl">Fone</label><input class="fi" id="c_fone"></div>
        <div class="fg"><label class="fl">E-mail</label><input class="fi" id="c_email"></div>
      </div>
      <div class="fg"><label class="fl">Endereço</label><input class="fi" id="c_endereco"></div>
      <div class="fg"><label class="fl">Observações</label><input class="fi" id="c_obs"></div>
    </div>
    <div class="mf">
      <button class="btn" id="cDel" onclick="delCliBtn()" style="color:var(--red)"><span class="material-symbols-rounded">delete</span>Excluir</button>
      <span class="spacer"></span>
      <button class="btn btn-p" onclick="saveCli()"><span class="material-symbols-rounded">check</span>Salvar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const STORE="ex_crm_v1";
/* ===== NUVEM (Supabase) — mesma conexão/sessão do app ===== */
const SB_URL='https://djguxdgaobtminatxkdr.supabase.co';
const SB_KEY='sb_publishable_ERMLJI78W6ps_5Ppi9V0hg_OCAZwoIf';
const SB=(window.supabase&&SB_URL)?window.supabase.createClient(SB_URL,SB_KEY):null;
let CLOUD=false, EMPRESA_ID=null;
function cloudMsg(t){ const e=document.getElementById('cloudb'); if(e)e.textContent=t; }
const mCli=c=>({id:c.id,empresa_id:EMPRESA_ID,tipo:c.tipo,pai_id:c.paiId||null,nome:c.nome,cnpj:c.cnpj||null,contato:c.contato||null,fone:c.fone||null,email:c.email||null,endereco:c.endereco||null,obs:c.obs||null});
const mFase=(f,ord)=>({id:f.id,empresa_id:EMPRESA_ID,nome:f.nome,ordem:ord,tipo:f.fim?'final':'ativa'});
const mOpp=o=>({id:o.id,empresa_id:EMPRESA_ID,contratante_id:o.contratanteId||null,contemplado_id:o.contempladoId||null,fase_id:o.colId||null,objeto:o.objeto||null,temperatura:o.temperatura||'Morno',data_limite:o.dataLimite||null,obs:o.obs||null});
function cUp(table,row){ if(!CLOUD)return; SB.from(table).upsert(row).then(({error})=>{ if(error){console.error('cloud up',table,error);cloudMsg('erro ao salvar na nuvem');} }); }
function cDel(table,id){ if(!CLOUD)return; SB.from(table).update({deleted_at:new Date().toISOString()}).eq('id',id).then(({error})=>{ if(error)console.error('cloud del',table,error); }); }
function cFases(){ if(!CLOUD)return; SB.from('crm_fases').upsert(S.colunas.map((f,i)=>mFase(f,i))).then(({error})=>{ if(error)console.error('cloud fases',error); }); }
async function carregarNuvem(){
  const [cl,fa,op]=await Promise.all([
    SB.from('clientes').select('*').is('deleted_at',null),
    SB.from('crm_fases').select('*').is('deleted_at',null).order('ordem'),
    SB.from('oportunidades').select('*').is('deleted_at',null)
  ]);
  if(cl.error||fa.error||op.error) throw (cl.error||fa.error||op.error);
  S={ v:3,
    colunas:(fa.data||[]).map(f=>({id:f.id,nome:f.nome,fim:f.tipo==='final'})),
    clientes:(cl.data||[]).map(c=>({id:c.id,nome:c.nome,tipo:c.tipo,paiId:c.pai_id,cnpj:c.cnpj,contato:c.contato,fone:c.fone,email:c.email,endereco:c.endereco,obs:c.obs})),
    oportunidades:(op.data||[]).map(o=>({id:o.id,contratanteId:o.contratante_id,contempladoId:o.contemplado_id,objeto:o.objeto,temperatura:o.temperatura,dataLimite:o.data_limite||'',colId:o.fase_id,obs:o.obs}))
  };
  if(!S.colunas.length) await seedFases();
}
async function seedFases(){
  const pad=[['Leads',0,'ativa'],['Visita técnica',1,'ativa'],['Gerando proposta',2,'ativa'],['Em negociação',3,'ativa'],['Obra / execução',4,'ativa'],['Concluído',5,'final'],['Geladeira',6,'ativa'],['Declinado',7,'ativa']];
  const rows=pad.map(p=>({id:uid(),empresa_id:EMPRESA_ID,nome:p[0],ordem:p[1],tipo:p[2]}));
  const {error}=await SB.from('crm_fases').insert(rows);
  if(error){console.error('seed fases',error);return;}
  S.colunas=rows.map(r=>({id:r.id,nome:r.nome,fim:r.tipo==='final'}));
}
async function initCRM(){
  if(SB){ try{
    const {data:{session}}=await SB.auth.getSession();
    if(session){
      try{ const emp=await SB.rpc('empresa_atual'); EMPRESA_ID=(emp&&emp.data)||null; }catch(e){}
      await carregarNuvem(); CLOUD=true; cloudMsg('nuvem ✓');
    } else { cloudMsg('modo local (sem login)'); }
  }catch(e){ console.error(e); cloudMsg('erro nuvem — modo local'); CLOUD=false; } }
  if(!CLOUD){ load(); }
  render();
}
const TEMPS=["Frio","Morno","Quente"];
let S=null, TAB='funil', SELO=null, SELC=null, EDITO=null, EDITC=null, _drag=null, _oc=null, _op=null, _ot='Morno', _fromPipe=null;
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);});
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ini=n=>String(n||'?').trim().slice(0,2).toUpperCase();
const cli=id=>S.clientes.find(x=>x.id===id);
const fmtBRL=n=>'R$ '+(Math.round((+n||0)*100)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function orcIndex(){ try{return JSON.parse(localStorage.getItem('ex_orc_index')||'{}');}catch(e){return {};} }

function demo(){ return { v:3,
  colunas:[

function load(){
  try{const r=localStorage.getItem(STORE);S=r?JSON.parse(r):demo();}catch(e){S=demo();}
  if(!S||!Array.isArray(S.clientes)||!Array.isArray(S.colunas)||!Array.isArray(S.oportunidades)) S=demo();
  const first=S.colunas[0].id;
  S.oportunidades.forEach(o=>{ if(!S.colunas.find(k=>k.id===o.colId)) o.colId=first; });
  save();
}
function save(){ try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){} }
function resetDemo(){ if(CLOUD){ if(confirm("Recarregar do banco (nuvem)?")){ carregarNuvem().then(()=>{SELO=null;SELC=null;render();}).catch(e=>console.error(e)); } return; } if(confirm("Recarregar o exemplo? As edições atuais serão perdidas.")){S=demo();SELO=null;SELC=null;save();render();} }

const contratantes=()=>S.clientes.filter(c=>c.tipo==="contratante");
const filhos=id=>S.clientes.filter(c=>c.tipo==="contemplado"&&c.paiId===id);
const oppsIn=colId=>S.oportunidades.filter(o=>o.colId===colId);
const colIdx=id=>S.colunas.findIndex(k=>k.id===id);
const colNome=id=>{const k=S.colunas.find(x=>x.id===id);return k?k.nome:'';};
function titulo(o){ const ct=cli(o.contratanteId), cp=cli(o.contempladoId); return [ct?ct.nome:'—', cp?cp.nome:null, o.objeto||null].filter(Boolean).join(' · '); }
function matchQ(o){ const q=(document.getElementById('q').value||'').toLowerCase(); if(!q)return true; return titulo(o).toLowerCase().includes(q); }

function setTab(t){ TAB=t; document.getElementById('tab-funil').classList.toggle('on',t==='funil'); document.getElementById('tab-clientes').classList.toggle('on',t==='clientes');
  document.getElementById('v-funil').classList.toggle('on',t==='funil'); document.getElementById('v-clientes').classList.toggle('on',t==='clientes'); render(); }
function render(){ if(TAB==='funil'){ renderBoard(); renderOppDetail(); } else { renderClist(); renderCdetail(); } }

    const cards=oppsIn(col.id).filter(matchQ);

      <div class="kcol-h">
        ${col.fim?'<span class="material-symbols-rounded" style="font-size:15px;color:var(--green)">check_circle</span>':''}
        <span class="kcol-nm" title="Renomear" onclick="renameColuna('${col.id}')">${esc(col.nome)}</span>
        <span class="kcol-ct">${cards.length}</span>
        <span class="kcol-acts">
          <button class="ib" onclick="moveColuna('${col.id}',-1)" ${ci===0?'disabled':''}><span class="material-symbols-rounded">chevron_left</span></button>
          <button class="ib" onclick="moveColuna('${col.id}',1)" ${ci===S.colunas.length-1?'disabled':''}><span class="material-symbols-rounded">chevron_right</span></button>
          <button class="ib del" onclick="delColuna('${col.id}')" ${S.colunas.length<=1?'disabled':''}><span class="material-symbols-rounded">delete</span></button>
        </span>
      </div>
      <div class="kcol-body">
        ${cards.map(o=>oppCardHTML(o,ci)).join('')}

      </div>
    </div>`;
  }).join('') + `<button class="newcol" onclick="addColuna()"><span class="material-symbols-rounded">add</span>Nova fase</button>`;
}
function oppCardHTML(o,ci){
  const ct=cli(o.contratanteId), tc=(o.temperatura||'Morno').toLowerCase(), oc=orcIndex()[o.id];
  return `<div class="kcard ${SELO===o.id?'sel':''}" draggable="true" ondragstart="dragStart(event,'${o.id}')" ondragend="_drag=null" onclick="selOpp('${o.id}')">
    <div class="kcard-nm">${esc(o.objeto||'(sem objeto)')}</div>
    <div class="kcard-cli"><span class="material-symbols-rounded">business</span>${esc(ct?ct.nome:'—')}${o.contempladoId&&cli(o.contempladoId)?' · '+esc(cli(o.contempladoId).nome):''}</div>
    ${oc?`<div class="orcb ${esc(oc.status||'rascunho')}"><span class="material-symbols-rounded">request_quote</span>${fmtBRL(oc.total)} · ${esc(oc.status||'rascunho')}</div>`:''}
    <div class="kcard-foot">
      <span class="temp ${tc}">${esc(o.temperatura||'Morno')}</span>
      <span class="kmove">
        <button title="Fase anterior" onclick="event.stopPropagation();moveOpp('${o.id}',-1)" ${ci===0?'disabled':''}>‹</button>
        <button title="Próxima fase" onclick="event.stopPropagation();moveOpp('${o.id}',1)" ${ci===S.colunas.length-1?'disabled':''}>›</button>
      </span>
    </div>
  </div>`;
}
function dragStart(e,id){ _drag=id; try{e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move';}catch(_){} }
function allow(e,el){ e.preventDefault(); if(el)el.classList.add('dragover'); }
function drop(e,colId,el){ e.preventDefault(); if(el)el.classList.remove('dragover'); const id=_drag||(e.dataTransfer&&e.dataTransfer.getData('text/plain')); const o=id&&S.oportunidades.find(x=>x.id===id); if(o){ o.colId=colId; save(); cUp('oportunidades',mOpp(o)); render(); } _drag=null; }
function moveOpp(id,dir){ const o=S.oportunidades.find(x=>x.id===id); if(!o)return; const i=colIdx(o.colId)+dir; if(i<0||i>=S.colunas.length)return; o.colId=S.colunas[i].id; save(); cUp('oportunidades',mOpp(o)); render(); }
function selOpp(id){ SELO=id; render(); const d=document.getElementById('oppDetail'); if(d)d.scrollIntoView({behavior:'smooth',block:'nearest'}); }

function addColuna(){ const nm=prompt('Nome da nova fase:'); if(nm&&nm.trim()){ S.colunas.push({id:uid(),nome:nm.trim()}); save(); cFases(); render(); } }
function renameColuna(id){ const k=S.colunas.find(x=>x.id===id); if(!k)return; const nm=prompt('Renomear fase:',k.nome); if(nm&&nm.trim()){ k.nome=nm.trim(); save(); cFases(); render(); } }
function moveColuna(id,dir){ const i=colIdx(id), j=i+dir; if(j<0||j>=S.colunas.length)return; const a=S.colunas;[a[i],a[j]]=[a[j],a[i]]; save(); cFases(); render(); }
function delColuna(id){ if(S.colunas.length<=1)return; const n=oppsIn(id).length; const dest=S.colunas.find(k=>k.id!==id); if(!confirm(`Excluir a fase "${colNome(id)}"?`+(n?` As ${n} oportunidade(s) vão para "${dest.nome}".`:'')))return; const movidas=S.oportunidades.filter(o=>o.colId===id); S.oportunidades.forEach(o=>{if(o.colId===id)o.colId=dest.id;}); S.colunas=S.colunas.filter(k=>k.id!==id); save(); cDel('crm_fases',id); movidas.forEach(o=>cUp('oportunidades',mOpp(o))); cFases(); render(); }

/* modal oportunidade */
function novaOpp(colId){ openOpp(null, colId); }
function openOpp(id,colId){
  const o=id?S.oportunidades.find(x=>x.id===id):null;
  EDITO={id:id||null, colId:(o?o.colId:(colId||S.colunas[0].id))};
  _oc=o?o.contratanteId:null; _op=o?o.contempladoId:null; _ot=o?(o.temperatura||'Morno'):'Morno'; _fromPipe=null;
  document.getElementById('oTitle').textContent=id?'Editar oportunidade':'Nova oportunidade';
  document.getElementById('o_objeto').value=o?(o.objeto||''):'';
  document.getElementById('o_obs').value=o?(o.obs||''):'';
  document.getElementById('o_data').value=o?(o.dataLimite||''):'';
  document.getElementById('oDel').style.display=id?'inline-flex':'none';
  renderOppSelects();
  document.getElementById('modalOpp').classList.add('show');
}
function renderOppSelects(){
  const ctSel=document.getElementById('o_contratante_sel');
  ctSel.innerHTML=`<option value="">— escolher contratante —</option>`+contratantes().map(c=>`<option value="${c.id}" ${_oc===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')+`<option value="__new">+ Cadastrar novo contratante…</option>`;
  const cpSel=document.getElementById('o_contemplado_sel');
  const subs=_oc?filhos(_oc):[];
  cpSel.innerHTML=`<option value="">${_oc?'— (opcional) —':'escolha o contratante primeiro'}</option>`+subs.map(s=>`<option value="${s.id}" ${_op===s.id?'selected':''}>${esc(s.nome)}</option>`).join('')+(_oc?`<option value="__new">+ Cadastrar novo contemplado…</option>`:'');
  document.getElementById('o_temp').innerHTML=TEMPS.map(t=>`<span class="chip ${_ot===t?'sel':''}" onclick="pickTemp('${t}')">${t}</span>`).join('');
}
function onContratante(val){ if(val==='__new'){ document.getElementById('o_contratante_sel').value=_oc||''; openCliFromPipe('contratante'); return; } _oc=val||null; if(_op&&(!_oc||!filhos(_oc).find(s=>s.id===_op)))_op=null; renderOppSelects(); }
function onContemplado(val){ if(val==='__new'){ document.getElementById('o_contemplado_sel').value=_op||''; if(!_oc){alert('Escolha o contratante primeiro.');return;} openCliFromPipe('contemplado'); return; } _op=val||null; }
function pickTemp(t){ _ot=t; renderOppSelects(); }
function openCliFromPipe(tipo){ _fromPipe=tipo; openCli(tipo,null); }
function closeOpp(){ document.getElementById('modalOpp').classList.remove('show'); EDITO=null; }
function saveOpp(){
  if(!_oc){ alert('Escolha o cliente contratante.'); return; }
  const data={contratanteId:_oc, contempladoId:_op, objeto:document.getElementById('o_objeto').value.trim(), temperatura:_ot, dataLimite:document.getElementById('o_data').value, obs:document.getElementById('o_obs').value.trim()};
  let alvo;
  if(EDITO.id){ alvo=S.oportunidades.find(x=>x.id===EDITO.id); Object.assign(alvo, data); }
  else{ alvo={id:uid(),colId:EDITO.colId,...data}; S.oportunidades.push(alvo); SELO=alvo.id; }
  save(); cUp('oportunidades',mOpp(alvo)); closeOpp(); render();
}
function delOpp(){ if(EDITO&&EDITO.id&&confirm('Excluir esta oportunidade?')){ const id=EDITO.id; S.oportunidades=S.oportunidades.filter(x=>x.id!==id); if(SELO===id)SELO=null; save(); cDel('oportunidades',id); closeOpp(); render(); } }
function duplicarOpp(id){
  const o=S.oportunidades.find(x=>x.id===id); if(!o)return;
  if(!confirm('Duplicar esta oportunidade com o orçamento junto?'))return;
  const novo={...o, id:uid(), objeto:(o.objeto||'')+' (cópia)'};
  S.oportunidades.push(novo);
  try{ const src=localStorage.getItem('ex_orc_v6__'+id); if(src) localStorage.setItem('ex_orc_v6__'+novo.id, src);
       const idx=orcIndex(); if(idx[id]){ idx[novo.id]={...idx[id]}; localStorage.setItem('ex_orc_index',JSON.stringify(idx)); } }catch(e){}
  SELO=novo.id; save(); cUp('oportunidades',mOpp(novo)); render();
}

/* ===== ponte com o Orçamento ===== */
function gerarOrcamento(id){
  const o=S.oportunidades.find(x=>x.id===id); if(!o)return;
  if(!orcIndex()[id]){   // 1ª vez: manda o pré-preenchimento
    const ct=cli(o.contratanteId), cp=cli(o.contempladoId);
    const prefill={ oppId:o.id, cliNome:ct?ct.nome:'', cliContato:ct?(ct.contato||''):'', cliFone:ct?(ct.fone||''):'', cliEmail:ct?(ct.email||''):'',
      finNome:cp?cp.nome:'', finEnd:cp?(cp.endereco||''):'', solTitulo:o.objeto||'', solDesc:o.obs||'' };
    try{ localStorage.setItem('ex_orc_prefill', JSON.stringify(prefill)); }catch(e){}
  }
  window.open('eX_Orcamento.html?opp='+id,'_blank');
}
function gerarOrcBarramento(id){
  const o=S.oportunidades.find(x=>x.id===id); if(!o)return;
  const ct=cli(o.contratanteId), cp=cli(o.contempladoId);
  const prefill={ oppId:o.id, cliNome:ct?ct.nome:'', cliContato:ct?(ct.contato||''):'', cliFone:ct?(ct.fone||''):'', cliEmail:ct?(ct.email||''):'',
    finNome:cp?cp.nome:'', solTitulo:o.objeto||'', solDesc:o.obs||'' };
  try{ localStorage.setItem('ex_orc_bar_prefill', JSON.stringify(prefill)); }catch(e){}
  window.open('eX_Orcamento_Barramento.html?opp='+id,'_blank');
}
function gerarObra(id){
  const o=S.oportunidades.find(x=>x.id===id); if(!o)return;
  let orc=null; try{ orc=JSON.parse(localStorage.getItem('ex_orc_v6__'+id)||'null'); }catch(e){}
  if(!orc){ alert('Gere o orçamento desta oportunidade primeiro.'); return; }
  const ct=cli(o.contratanteId), cp=cli(o.contempladoId);
  const servicos=(orc.servicos||[]).filter(s=>s&&s.desc).map(s=>({nome:s.desc, qtd:(+s.qtd||1)}));
  if(!servicos.length){ if(!confirm('O orçamento não tem serviços. Criar a obra mesmo assim (vazia)?'))return; }
  const payload={ oppId:o.id, numero:orc.numero||'', nome:o.objeto||titulo(o), contratante:ct?ct.nome:'', contemplado:cp?cp.nome:'', obs:o.obs||'', servicos };
  try{ localStorage.setItem('ex_obra_pending', JSON.stringify(payload)); }catch(e){}
  window.open('index.html','_blank');
}

function openCli(tipo,id){
  EDITC={tipo, id:id||null};
  const c=id?S.clientes.find(x=>x.id===id):null;
  document.getElementById('cTitle').textContent=(id?'Editar ':'Novo ')+(tipo==='contratante'?'contratante':'contemplado / loja');
  ['nome','cnpj','contato','fone','email','endereco','obs'].forEach(f=>document.getElementById('c_'+f).value=c?(c[f]||''):'');
  document.getElementById('cDel').style.display=id?'inline-flex':'none';
  document.getElementById('modalCli').classList.add('show');
}
function closeCli(){ document.getElementById('modalCli').classList.remove('show'); EDITC=null; _fromPipe=null; }
function saveCli(){
  const fp=_fromPipe;
  const g=f=>document.getElementById('c_'+f).value.trim();
  const nome=g('nome'); if(!nome){ alert('Informe o nome.'); return; }
  const data={nome,cnpj:g('cnpj'),contato:g('contato'),fone:g('fone'),email:g('email'),endereco:g('endereco'),obs:g('obs')};
  let alvo;
  if(EDITC.id){ alvo=S.clientes.find(x=>x.id===EDITC.id); Object.assign(alvo, data); }
  else if(EDITC.tipo==='contratante'){ alvo={id:uid(),tipo:'contratante',paiId:null,...data}; S.clientes.push(alvo); if(fp){_oc=alvo.id;_op=null;}else{SELC=alvo.id;} }
  else{ const parent=fp?_oc:SELC; alvo={id:uid(),tipo:'contemplado',paiId:parent,...data}; S.clientes.push(alvo); if(fp)_op=alvo.id; }
  save(); cUp('clientes',mCli(alvo)); closeCli();
  if(fp) renderOppSelects();
  render();
}
function delCliBtn(){ if(EDITC&&EDITC.id) delCliDireto(EDITC.id,true); }
function delCliDireto(id,fromModal){
  const c=S.clientes.find(x=>x.id===id); if(!c)return;
  if(!confirm(`Excluir "${c.nome}"?`+(c.tipo==='contratante'?' (contemplados e oportunidades ligadas também saem)':'')))return;
  const filhosIds=S.clientes.filter(x=>x.paiId===id).map(x=>x.id);
  let oppsRemovidas=[], oppsAtualizadas=[];
  if(c.tipo==='contratante'){ oppsRemovidas=S.oportunidades.filter(o=>o.contratanteId===id).map(o=>o.id); }
  else { oppsAtualizadas=S.oportunidades.filter(o=>o.contempladoId===id); }
  S.clientes=S.clientes.filter(x=>x.id!==id && x.paiId!==id);
  if(c.tipo==='contratante'){ S.oportunidades=S.oportunidades.filter(o=>o.contratanteId!==id); }
  else { S.oportunidades.forEach(o=>{ if(o.contempladoId===id)o.contempladoId=null; }); }
  if(SELC===id)SELC=null;
  save();
  cDel('clientes',id); filhosIds.forEach(fid=>cDel('clientes',fid));
  oppsRemovidas.forEach(oid=>cDel('oportunidades',oid));
  oppsAtualizadas.forEach(o=>cUp('oportunidades',mOpp(o)));
  if(fromModal)closeCli(); render();
}

initCRM();
</script>
</body>
