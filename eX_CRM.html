<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>eX Clientes (CRM)</title>
<meta name="theme-color" content="#533ab7">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" rel="stylesheet">
<style>
:root{
  --bg:#faf9f5;--surf:#fff;--surf2:#f1efe8;--line:rgba(0,0,0,.12);--line2:rgba(0,0,0,.22);
  --tx:#1a1a18;--tx2:#5f5e5a;--tx3:#888780;--pri:#533ab7;--pri-bg:#eeedfe;
  --blue:#185fa5;--green:#3b6d11;--amber:#ba7517;--red:#a32d2d;--teal:#0f6e56;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45}
.material-symbols-rounded{font-family:'Material Symbols Rounded';line-height:1;vertical-align:middle;font-size:20px}
.app{max-width:1300px;margin:0 auto;padding:16px 18px 60px}
.appbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--pri)}.logo b{color:var(--tx)}
.modtag{font-size:12px;font-weight:600;color:var(--tx2);background:var(--surf2);padding:4px 11px;border-radius:20px;display:inline-flex;align-items:center;gap:5px}
.modtag .material-symbols-rounded{font-size:16px;color:var(--pri)}
.spacer{flex:1}
.btn{font-size:13px;padding:8px 13px;border-radius:8px;border:1px solid var(--line2);background:var(--surf);color:var(--tx2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surf2)}
.btn .material-symbols-rounded{font-size:18px}
.btn-p{background:var(--pri);color:#fff;border-color:var(--pri)}.btn-p:hover{background:#472f9e}
.btn-s{font-size:12px;padding:5px 10px}
.sub{font-size:12px;color:var(--tx2);margin:2px 0 14px}
.search{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;background:var(--surf);min-width:180px}
.search input{border:none;outline:none;background:none;font-size:13px;color:var(--tx);width:100%}
.search .material-symbols-rounded{font-size:18px;color:var(--tx3)}

/* ===== KANBAN ===== */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kcol{flex:0 0 264px;background:var(--surf2);border-radius:12px;padding:8px;display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
.kcol.dragover{outline:2px dashed var(--pri);outline-offset:-2px}
.kcol-h{display:flex;align-items:center;gap:6px;padding:4px 6px 8px}
.kcol-nm{font-size:12.5px;font-weight:700;color:var(--tx);cursor:text;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcol-nm:hover{color:var(--pri)}
.kcol-ct{font-size:11px;font-weight:700;color:var(--tx2);background:var(--surf);border-radius:10px;padding:1px 8px}
.kcol-acts{display:flex;gap:1px;opacity:.35;transition:.1s}
.kcol-h:hover .kcol-acts{opacity:1}
.ib{width:22px;height:22px;border:none;border-radius:5px;background:none;color:var(--tx3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.ib:hover{background:var(--surf);color:var(--pri)}
.ib:disabled{opacity:.25;cursor:default}
.ib.del:hover{background:#fcebeb;color:var(--red)}
.ib .material-symbols-rounded{font-size:15px}
.kcol-body{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.kcard{background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:10px 11px;cursor:pointer;transition:.1s}
.kcard:hover{border-color:var(--line2);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.kcard.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-bg)}
.kcard-nm{font-size:13px;font-weight:700}
.kcard-mt{font-size:11px;color:var(--tx3);margin-top:2px;display:flex;align-items:center;gap:4px}
.kcard-mt .material-symbols-rounded{font-size:13px}
.kcard-foot{display:flex;align-items:center;gap:6px;margin-top:8px}
.kbadge{font-size:10px;color:var(--pri);background:var(--pri-bg);padding:2px 7px;border-radius:10px;display:inline-flex;align-items:center;gap:3px}
.kbadge .material-symbols-rounded{font-size:12px}
.kmove{margin-left:auto;display:flex;gap:1px}
.kmove button{width:22px;height:22px;border:1px solid var(--line);border-radius:6px;background:var(--surf);color:var(--tx3);cursor:pointer;font-size:14px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.kmove button:hover:not(:disabled){background:var(--pri-bg);border-color:var(--pri);color:var(--pri)}
.kmove button:disabled{opacity:.3;cursor:default}
.kadd{font-size:12px;color:var(--tx3);background:none;border:1px dashed var(--line2);border-radius:8px;padding:6px;cursor:pointer;margin-top:2px}
.kadd:hover{color:var(--pri);border-color:var(--pri);background:var(--surf)}
.newcol{flex:0 0 150px;border:1px dashed var(--line2);border-radius:12px;background:none;color:var(--tx3);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;gap:5px;min-height:52px}
.newcol:hover{color:var(--pri);border-color:var(--pri)}
.newcol .material-symbols-rounded{font-size:17px}

/* ===== DETALHE ===== */
.detail{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:16px}
.dhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.davatar{width:46px;height:46px;border-radius:11px;background:var(--pri-bg);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0}
.dhead .dt{flex:1;min-width:0}
.dhead .dt h2{font-size:18px;font-weight:700}
.dhead .dt .kind{font-size:11px;color:var(--tx2);background:var(--surf2);padding:2px 9px;border-radius:20px;display:inline-block;margin-top:3px}
.dhead .dt .fase{font-size:11px;color:var(--pri);background:var(--pri-bg);padding:2px 9px;border-radius:20px;display:inline-block;margin-top:3px;margin-left:5px}
.dinfo{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 18px;margin-bottom:6px}
@media(max-width:560px){.dinfo{grid-template-columns:1fr}}
.di{display:flex;flex-direction:column;gap:2px}
.di .l{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);font-weight:600}
.di .v{font-size:13px;color:var(--tx)}.di .v.empty{color:var(--tx3);font-style:italic}
.dobs{font-size:12px;color:var(--tx2);margin-top:10px;padding:10px 12px;background:var(--surf2);border-radius:8px}
.sec2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);margin:20px 0 10px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sec2 .material-symbols-rounded{font-size:16px;color:var(--pri)}
.subcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px}
.subc{border:1px solid var(--line);border-radius:9px;padding:10px 12px;position:relative}
.subc .nm{font-size:13px;font-weight:600}.subc .mt{font-size:11px;color:var(--tx3);margin-top:2px}
.subc .acts{position:absolute;top:8px;right:8px;display:flex;gap:2px;opacity:0;transition:.1s}
.subc:hover .acts{opacity:1}
.iconb{width:24px;height:24px;border:1px solid var(--line);border-radius:6px;background:var(--surf);color:var(--tx3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.iconb:hover{background:var(--pri-bg);border-color:var(--pri);color:var(--pri)}
.iconb.del:hover{background:#fcebeb;border-color:var(--red);color:var(--red)}
.iconb .material-symbols-rounded{font-size:15px}
.empty{padding:22px;text-align:center;color:var(--tx3);font-size:13px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
.modal-bg.show{display:flex}
.modal{background:var(--surf);border-radius:13px;width:520px;max-width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.mh b{font-size:15px;font-weight:700}.mh .x{cursor:pointer;color:var(--tx3);background:none;border:none;display:flex}
.mb{padding:16px 18px;overflow-y:auto}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.fg{margin-bottom:12px}.fl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);margin-bottom:5px;display:block}
.fi{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:7px;background:var(--surf);font-size:13px;color:var(--tx);font-family:inherit}
.fi:focus{outline:none;border-color:var(--pri)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style>
</head>
<body>
<div class="app">
  <div class="appbar">
    <span class="logo"><b>e</b>X</span>
    <span class="modtag"><span class="material-symbols-rounded">contacts</span>Clientes (CRM)</span>
    <span class="spacer"></span>
    <div class="search"><span class="material-symbols-rounded">search</span><input id="q" placeholder="Buscar…" oninput="render()"></div>
    <button class="btn btn-p" onclick="novoNaEntrada()"><span class="material-symbols-rounded">add</span>Novo card</button>
    <button class="btn" onclick="resetDemo()" title="Recarregar exemplo"><span class="material-symbols-rounded">restart_alt</span></button>
  </div>
  <div class="sub">Funil comercial estilo Pipefy: o card entra na <b>Caixa de entrada</b> e avança pelas fases até o <b>Contrato fechado</b>. Arraste o card ou use ‹ ›. Clique no título da coluna para renomear. Estes clientes alimentam o <b>Orçamento</b>.</div>

  <div class="board" id="board"></div>
  <div id="detailWrap"></div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="mh"><b id="mTitle">Cliente</b><button class="x" onclick="closeCli()"><span class="material-symbols-rounded">close</span></button></div>
    <div class="mb">
      <div class="fg"><label class="fl">Nome / razão social</label><input class="fi" id="f_nome"></div>
      <div class="frow">
        <div class="fg"><label class="fl">CNPJ</label><input class="fi" id="f_cnpj"></div>
        <div class="fg"><label class="fl">Contato</label><input class="fi" id="f_contato"></div>
      </div>
      <div class="frow">
        <div class="fg"><label class="fl">Fone</label><input class="fi" id="f_fone"></div>
        <div class="fg"><label class="fl">E-mail</label><input class="fi" id="f_email"></div>
      </div>
      <div class="fg"><label class="fl">Endereço</label><input class="fi" id="f_endereco"></div>
      <div class="fg"><label class="fl">Observações</label><input class="fi" id="f_obs"></div>
    </div>
    <div class="mf">
      <button class="btn" id="mDel" onclick="delCli()" style="color:var(--red)"><span class="material-symbols-rounded">delete</span>Excluir</button>
      <span class="spacer"></span>
      <button class="btn btn-p" onclick="saveCli()"><span class="material-symbols-rounded">check</span>Salvar</button>
    </div>
  </div>
</div>

<script>
"use strict";
const STORE="ex_crm_v1";
let S=null, SEL=null, EDIT=null, _drag=null;
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ini=n=>String(n||'?').trim().slice(0,2).toUpperCase();

function demo(){ return { v:2,
  colunas:[
    {id:"entrada",nome:"Caixa de entrada"},
    {id:"qualif",nome:"Qualificação"},
    {id:"proposta",nome:"Proposta"},
    {id:"contrato",nome:"Contrato fechado"}
  ],
  clientes:[
    {id:"copeland",nome:"COPELAND",tipo:"contratante",paiId:null,colId:"contrato",cnpj:"",contato:"Denis Ferraz",fone:"11 98950-4477",email:"denis.ferraz@copeland.com",endereco:"",obs:"Marca de refrigeração/automação; contrata a eX para as lojas contempladas."},
    {id:"assai",nome:"ASSAÍ NACIONAL",tipo:"contemplado",paiId:"copeland",contato:"",fone:"",email:"",endereco:"Nacional",obs:""},
    {id:"atacadao",nome:"ATACADÃO",tipo:"contemplado",paiId:"copeland",contato:"",fone:"",email:"",endereco:"",obs:""},
    {id:"pao",nome:"PÃO DE AÇÚCAR",tipo:"contemplado",paiId:"copeland",contato:"",fone:"",email:"",endereco:"",obs:""},
    {id:"economart",nome:"ECONOMART",tipo:"contemplado",paiId:"copeland",contato:"",fone:"",email:"",endereco:"",obs:""},
    {id:"gy",nome:"GREENYELLOW",tipo:"contratante",paiId:null,colId:"proposta",cnpj:"",contato:"",fone:"",email:"",endereco:"",obs:"Integrador de sistemas; contratante recorrente."},
    {id:"lead1",nome:"NOVO LEAD (indústria)",tipo:"contratante",paiId:null,colId:"entrada",cnpj:"",contato:"",fone:"",email:"",endereco:"",obs:"Contato inicial — a qualificar."}
  ]};}

function load(){
  try{const r=localStorage.getItem(STORE);S=r?JSON.parse(r):demo();}catch(e){S=demo();}
  if(!S.clientes)S=demo();
  // migração de dados antigos (v1 sem colunas)
  if(!Array.isArray(S.colunas)||!S.colunas.length){ S.colunas=demo().colunas; }
  const first=S.colunas[0].id;
  S.clientes.forEach(c=>{ if(c.tipo==='contratante'&&!S.colunas.find(k=>k.id===c.colId)) c.colId=first; });
  save();
}
function save(){ try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){} }
function resetDemo(){ if(confirm("Recarregar o exemplo? As edições atuais serão perdidas.")){S=demo();SEL=null;save();render();} }

const contratantes=()=>S.clientes.filter(c=>c.tipo==="contratante");
const filhos=id=>S.clientes.filter(c=>c.tipo==="contemplado"&&c.paiId===id);
const cardsIn=colId=>contratantes().filter(c=>c.colId===colId);
const colIdx=colId=>S.colunas.findIndex(k=>k.id===colId);
const colNome=colId=>{const k=S.colunas.find(x=>x.id===colId);return k?k.nome:'';};
function matchQ(c){ const q=(document.getElementById('q').value||'').toLowerCase(); if(!q)return true; return (c.nome+' '+(c.contato||'')).toLowerCase().includes(q); }

function render(){ renderBoard(); renderDetail(); }

function renderBoard(){
  document.getElementById('board').innerHTML = S.colunas.map((col,ci)=>{
    const cards=cardsIn(col.id).filter(matchQ);
    return `<div class="kcol" ondragover="allow(event,this)" ondragleave="this.classList.remove('dragover')" ondrop="drop(event,'${col.id}',this)">
      <div class="kcol-h">
        <span class="kcol-nm" title="Clique para renomear" onclick="renameColuna('${col.id}')">${esc(col.nome)}</span>
        <span class="kcol-ct">${cards.length}</span>
        <span class="kcol-acts">
          <button class="ib" title="Mover coluna ←" onclick="moveColuna('${col.id}',-1)" ${ci===0?'disabled':''}><span class="material-symbols-rounded">chevron_left</span></button>
          <button class="ib" title="Mover coluna →" onclick="moveColuna('${col.id}',1)" ${ci===S.colunas.length-1?'disabled':''}><span class="material-symbols-rounded">chevron_right</span></button>
          <button class="ib del" title="Excluir coluna" onclick="delColuna('${col.id}')" ${S.colunas.length<=1?'disabled':''}><span class="material-symbols-rounded">delete</span></button>
        </span>
      </div>
      <div class="kcol-body">
        ${cards.map(c=>cardHTML(c,ci)).join('')}
        <button class="kadd" onclick="openCli('contratante',null,'${col.id}')">+ card aqui</button>
      </div>
    </div>`;
  }).join('') + `<button class="newcol" onclick="addColuna()"><span class="material-symbols-rounded">add</span>Nova fase</button>`;
}
function cardHTML(c,ci){
  return `<div class="kcard ${SEL===c.id?'sel':''}" draggable="true" ondragstart="dragStart(event,'${c.id}')" ondragend="_drag=null" onclick="selecionar('${c.id}')">
    <div class="kcard-nm">${esc(c.nome)}</div>
    <div class="kcard-mt"><span class="material-symbols-rounded">person</span>${esc(c.contato||'—')}</div>
    <div class="kcard-foot">
      <span class="kbadge"><span class="material-symbols-rounded">account_tree</span>${filhos(c.id).length}</span>
      <span class="kmove">
        <button title="Fase anterior" onclick="event.stopPropagation();moveCard('${c.id}',-1)" ${ci===0?'disabled':''}>‹</button>
        <button title="Próxima fase" onclick="event.stopPropagation();moveCard('${c.id}',1)" ${ci===S.colunas.length-1?'disabled':''}>›</button>
      </span>
    </div>
  </div>`;
}

/* drag & drop */
function dragStart(e,id){ _drag=id; try{e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move';}catch(_){} }
function allow(e,el){ e.preventDefault(); if(el)el.classList.add('dragover'); }
function drop(e,colId,el){ e.preventDefault(); if(el)el.classList.remove('dragover'); const id=_drag||(e.dataTransfer&&e.dataTransfer.getData('text/plain')); const c=id&&S.clientes.find(x=>x.id===id); if(c&&c.tipo==='contratante'){ c.colId=colId; save(); render(); } _drag=null; }

/* mover / colunas */
function moveCard(id,dir){ const c=S.clientes.find(x=>x.id===id); if(!c)return; const i=colIdx(c.colId)+dir; if(i<0||i>=S.colunas.length)return; c.colId=S.colunas[i].id; save(); render(); }
function novoNaEntrada(){ openCli('contratante',null,S.colunas[0].id); }
function addColuna(){ const nm=prompt('Nome da nova fase:'); if(nm&&nm.trim()){ S.colunas.push({id:uid(),nome:nm.trim()}); save(); render(); } }
function renameColuna(id){ const k=S.colunas.find(x=>x.id===id); if(!k)return; const nm=prompt('Renomear fase:',k.nome); if(nm&&nm.trim()){ k.nome=nm.trim(); save(); render(); } }
function moveColuna(id,dir){ const i=colIdx(id), j=i+dir; if(j<0||j>=S.colunas.length)return; const a=S.colunas; [a[i],a[j]]=[a[j],a[i]]; save(); render(); }
function delColuna(id){ if(S.colunas.length<=1)return; const n=cardsIn(id).length; if(!confirm(`Excluir a fase "${colNome(id)}"?`+(n?` Os ${n} card(s) vão para "${S.colunas.find(k=>k.id!==id).nome}".`:'')))return; const dest=S.colunas.find(k=>k.id!==id).id; S.clientes.forEach(c=>{if(c.colId===id)c.colId=dest;}); S.colunas=S.colunas.filter(k=>k.id!==id); save(); render(); }

function selecionar(id){ SEL=id; render(); const d=document.getElementById('detailWrap'); if(d)d.scrollIntoView({behavior:'smooth',block:'nearest'}); }
function renderDetail(){
  const el=document.getElementById('detailWrap');
  if(!SEL || !S.clientes.find(c=>c.id===SEL)){ el.innerHTML=''; if(SEL&&!S.clientes.find(c=>c.id===SEL))SEL=null; return; }
  const c=S.clientes.find(x=>x.id===SEL), subs=filhos(c.id);
  const di=(l,v)=>`<div class="di"><span class="l">${l}</span><span class="v ${v?'':'empty'}">${v?esc(v):'—'}</span></div>`;
  el.innerHTML=`<div class="detail">
    <div class="dhead">
      <div class="davatar">${ini(c.nome)}</div>
      <div class="dt"><h2>${esc(c.nome)}</h2><div><span class="kind">Contratante</span><span class="fase">${esc(colNome(c.colId))}</span></div></div>
      <button class="btn btn-s" onclick="openCli('contratante','${c.id}')"><span class="material-symbols-rounded">edit</span>Editar</button>
    </div>
    <div class="dinfo">${di('CNPJ',c.cnpj)} ${di('Contato',c.contato)} ${di('Fone',c.fone)} ${di('E-mail',c.email)} ${di('Endereço',c.endereco)}</div>
    ${c.obs?`<div class="dobs">${esc(c.obs)}</div>`:''}
    <div class="sec2"><span class="material-symbols-rounded">account_tree</span>Contemplados / lojas<span class="spacer"></span>
      <button class="btn btn-s btn-p" onclick="openCli('contemplado')"><span class="material-symbols-rounded">add</span>Novo contemplado</button></div>
    ${subs.length?`<div class="subcards">${subs.map(s=>`
      <div class="subc">
        <div class="acts">
          <button class="iconb" onclick="openCli('contemplado','${s.id}')"><span class="material-symbols-rounded">edit</span></button>
          <button class="iconb del" onclick="delDireto('${s.id}')"><span class="material-symbols-rounded">close</span></button>
        </div>
        <div class="nm">${esc(s.nome)}</div><div class="mt">${esc(s.endereco||s.contato||'—')}</div>
      </div>`).join('')}</div>`:'<div class="empty" style="padding:14px">Nenhum contemplado ainda.</div>'}
  </div>`;
}

/* modal cliente */
function openCli(tipo,id,colId){
  EDIT={tipo, id:id||null, colId:colId||null};
  const c=id?S.clientes.find(x=>x.id===id):null;
  document.getElementById('mTitle').textContent=(id?'Editar ':'Novo ')+(tipo==='contratante'?'contratante':'contemplado / loja');
  ['nome','cnpj','contato','fone','email','endereco','obs'].forEach(f=>document.getElementById('f_'+f).value=c?(c[f]||''):'');
  document.getElementById('mDel').style.display=id?'inline-flex':'none';
  document.getElementById('modal').classList.add('show');
  setTimeout(()=>document.getElementById('f_nome').focus(),40);
}
function closeCli(){ document.getElementById('modal').classList.remove('show'); EDIT=null; }
function saveCli(){
  const g=f=>document.getElementById('f_'+f).value.trim();
  const nome=g('nome'); if(!nome){ alert('Informe o nome.'); return; }
  const data={nome,cnpj:g('cnpj'),contato:g('contato'),fone:g('fone'),email:g('email'),endereco:g('endereco'),obs:g('obs')};
  if(EDIT.id){ Object.assign(S.clientes.find(x=>x.id===EDIT.id), data); }
  else if(EDIT.tipo==='contratante'){ const nc={id:uid(),tipo:'contratante',paiId:null,colId:EDIT.colId||S.colunas[0].id,...data}; S.clientes.push(nc); SEL=nc.id; }
  else{ const nc={id:uid(),tipo:'contemplado',paiId:SEL,...data}; S.clientes.push(nc); }
  save(); closeCli(); render();
}
function delCli(){ if(EDIT&&EDIT.id) delDireto(EDIT.id,true); }
function delDireto(id,fromModal){
  const c=S.clientes.find(x=>x.id===id); if(!c)return;
  const nf=filhos(id).length;
  const msg=c.tipo==='contratante'?`Excluir "${c.nome}"${nf?` e seus ${nf} contemplado(s)`:''}?`:`Excluir "${c.nome}"?`;
  if(!confirm(msg))return;
  S.clientes=S.clientes.filter(x=>x.id!==id && x.paiId!==id);
  if(SEL===id)SEL=null;
  save(); if(fromModal)closeCli(); render();
}

load(); render();
</script>
</body>
